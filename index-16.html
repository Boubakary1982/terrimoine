  "Extension / périphérie": { t: "large", c: "#4C7A4F" }
};
var INV_STANDING = [
  { label: "Économique", cout: 120000 },
  { label: "Standard", cout: 170000 },
  { label: "Haut standing", cout: 260000 }
];
var INV_VILLA = { 3: { m2: 110, f: 0.8 }, 4: { m2: 150, f: 1 }, 5: { m2: 200, f: 1.3 } };
var INV_PROJETS = [
  { k: "terrain", l: "Terrain seul" },
  { k: "villa", l: "Villa" },
  { k: "r1", l: "Immeuble R+1", s: "2 niveaux" },
  { k: "r2", l: "Immeuble R+2", s: "3 niveaux" },
  { k: "r3", l: "Immeuble R+3", s: "4 niveaux" }
];
var INV_FRAIS_TERRAIN = 0.10;  // mutation, notaire, bornage, titre
var INV_IMPREVUS = 0.08;       // études, permis, imprévus (sur la construction)
var INV_EMPRISE = 0.5;         // part de la parcelle bâtie au sol (immeuble)
var INV_UTILE = 0.85;          // surface utile (hors circulations)
var INV_APPT_M2 = 65;          // surface d'un appartement
var INV_OCCUP = 0.9;           // taux d'occupation
var INV_CHARGES = 0.1;         // charges, entretien, impôts
var INV_LOT_MIN = 150;         // plus petit lot considéré comme constructible

function fmtM(n) {
  if (n >= 1e9) return (Math.round(n / 1e7) / 100).toString().replace(".", ",") + "\u00A0Md";
  if (n >= 1e6) {
    var v = n / 1e6;
    return (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toString().replace(".", ",") + "\u00A0M";
  }
  return fmt(n);
}
function invNum(v) { return Number(String(v).replace(/[^0-9]/g, "")) || 0; }
function invPct(x) { return (x * 100).toFixed(1).replace(".", ",") + " %"; }
function invProjetLabel(p) {
  var pr = INV_PROJETS.filter(function(x) { return x.k === p; })[0];
  return p === "villa" ? "Villa " + state.invVilla + " chambres" : pr.l;
}

function openInvest() { state.showInvest = true; render(); }
function closeInvest() { state.showInvest = false; render(); }
function invRefresh() {
  var c = document.querySelector(".content");
  var y = c ? c.scrollTop : 0;
  render();
  c = document.querySelector(".content");
  if (c) c.scrollTop = y;
}
function invSet(field, v) {
  state[field] = v;
  try { if (field === "invProjet") gtag("event", "simulation_projet", { projet: v }); } catch (e) {}
  invRefresh();
}
function invSetBudget(v) {
  var n = invNum(v);
  if (n < 1000000) n = 1000000;
  if (n > 5000000000) n = 5000000000;
  state.invBudget = n;
  try { gtag("event", "simulation_budget", { budget: Math.round(n / 1000000) + "M" }); } catch (e) {}
  invRefresh();
}
function invSetStanding(c) { state.invCout = c; invRefresh(); }
function invSetCout(v) {
  var n = invNum(v);
  if (n >= 50000 && n <= 1000000) state.invCout = n;
  invRefresh();
}

function invCalc(q, p) {
  var S = state.invParcelle, cout = state.invCout, B = state.invBudget;
  if (p === "terrain") {
    var surf = B / (q.prixM2 * (1 + INV_FRAIS_TERRAIN));
    return { surface: surf, ok: surf >= INV_LOT_MIN, total: q.prixM2 * INV_LOT_MIN * (1 + INV_FRAIS_TERRAIN) };
  }
  var terrain = q.prixM2 * S * (1 + INV_FRAIS_TERRAIN);
  var bati, units, loyer, raison = "";
  if (p === "villa") {
    var v = INV_VILLA[state.invVilla];
    bati = v.m2; units = 1;
    loyer = INV_LOYERS[q.nom].villa * v.f * state.invLoyer;
    if (bati > S * 0.6) raison = "Parcelle de " + S + " m² trop petite pour cette villa";
  } else {
    var n = (p === "r1") ? 1 : (p === "r2") ? 2 : 3;
    bati = S * INV_EMPRISE * (n + 1);
    units = Math.floor(bati * INV_UTILE / INV_APPT_M2);
    loyer = units * INV_LOYERS[q.nom].appt * state.invLoyer;
    if (units < 1) raison = "Parcelle trop petite pour un immeuble";
  }
  var constr = bati * cout * (1 + INV_IMPREVUS);
  var total = terrain + constr;
  var net = loyer * 12 * INV_OCCUP * (1 - INV_CHARGES);
  return { terrain: terrain, constr: constr, bati: bati, units: units, loyer: loyer, total: total, net: net,
           rend: net / total, retour: net > 0 ? total / net : 0, ok: !raison && total <= B, raison: raison };
}

function invRows(p) {
  var rows = VENTE_QUARTIERS.map(function(q) { return { q: q, r: invCalc(q, p) }; });
  var good = rows.filter(function(x) { return x.r.ok; });
  var bad = rows.filter(function(x) { return !x.r.ok; });
  good.sort(function(a, b) { return p === "terrain" ? b.r.surface - a.r.surface : b.r.rend - a.r.rend; });
  bad.sort(function(a, b) { return (a.r.raison ? 1 : 0) - (b.r.raison ? 1 : 0) || a.r.total - b.r.total; });
  return { good: good, bad: bad };
}

function invChip(label, active, onclick, sub) {
  return '<button onclick="' + onclick + '" style="min-width:0;padding:10px 4px;border-radius:8px;border:1px solid var(--bronze);background:' + (active ? "var(--bronze)" : "none") + ';color:' + (active ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12px;font-weight:600;cursor:pointer;line-height:1.25">' + label + (sub ? '<div style="font-size:10px;font-weight:400">' + sub + '</div>' : '') + '</button>';
}
function invGrid(cols, html) {
  return '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:6px">' + html + '</div>';
}
function invLabel(t) {
  return '<div style="font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:1.2px;color:var(--bronze);text-transform:uppercase;margin:14px 0 7px">' + t + '</div>';
}

function invOverview() {
  var B = state.invBudget;
  return INV_PROJETS.map(function(pr) {
    var res = invRows(pr.k);
    var n = res.good.length;
    var info;
    if (n === 0) {
      var minRow = res.bad.filter(function(x) { return !x.r.raison; })[0];
      info = minRow ? "Dès " + fmtM(minRow.r.total) + " F à " + minRow.q.nom : "Non réalisable avec ces réglages";
    } else if (pr.k === "terrain") {
      info = "Jusqu'à " + fmt(res.good[0].r.surface) + " m² à " + res.good[0].q.nom;
    } else {
      info = "Rendement net jusqu'à " + invPct(res.good[0].r.rend) + " (" + res.good[0].q.nom + ")";
    }
    if (n === 0 && pr.k !== "terrain" && pr.k !== "villa" && state.invParcelle > 200) {
      var keep = state.invParcelle; state.invParcelle = 200;
      var alt = invRows(pr.k).good.length; state.invParcelle = keep;
      if (alt) info += " · réalisable sur 200 m² dans " + alt + " quartier" + (alt > 1 ? "s" : "");
    }
    var sel = pr.k === state.invProjet;
    var sub = pr.k === "villa" ? state.invVilla + " ch. · " + INV_VILLA[state.invVilla].m2 + " m²" : (pr.s || "parcelles disponibles");
    return '<div onclick="invSet(\'invProjet\',\'' + pr.k + '\')" style="cursor:pointer;background:' + (sel ? "#FBF6EA" : "#fff") + ';border:' + (sel ? "2px solid var(--bronze)" : "1px solid var(--paper-deep)") + ';border-radius:10px;padding:' + (sel ? "11px 13px" : "12px 14px") + ';margin-bottom:8px">' +
      '<div class="row"><div><div class="quartier-name" style="font-size:15px">' + pr.l + '</div><div style="font-size:10.5px;color:var(--ink-soft)">' + sub + '</div></div>' +
      '<div style="text-align:right"><div class="quartier-val" style="color:' + (n ? "#4C7A4F" : "#B3472F") + '">' + n + ' / ' + VENTE_QUARTIERS.length + '</div><div style="font-size:10px;color:var(--ink-soft)">quartiers</div></div></div>' +
      '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px">' + info + '</div></div>';
  }).join("");
}

  }

    ? "Loyer estimé de la villa : " + fmtM(r.loyer) + " F/mois"
    : "≈ " + r.units + " appartement" + (r.units > 1 ? "s" : "") + " · loyers estimés " + fmtM(r.loyer) + " F/mois";
  return '<div class="card"' + (best ? ' style="border-color:var(--bronze);border-width:2px"' : '') + '>' +
    (best ? '<div style="font-family:\'Courier New\',monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--bronze);margin-bottom:6px">MEILLEUR RENDEMENT</div>' : '') +
    '<div class="row" style="align-items:flex-start;gap:10px"><div><div class="quartier-name">' + q.nom + '</div>' + zone + '</div>' +
    '<div style="text-align:right"><div class="quartier-val">' + fmtM(r.total) + ' F</div><div style="font-size:10.5px;color:#4C7A4F;font-weight:600">dans le budget</div></div></div>' +
    '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5">' + detail + '<br>' + loyer + '</div>' +
    '<div class="grid2" style="margin-top:10px"><div class="minicard" style="padding:10px"><b style="font-size:15px">' + invPct(r.rend) + '</b><small>Rendement net / an</small></div>' +
    '<div class="minicard" style="padding:10px"><b style="font-size:15px">' + (r.retour ? "~" + Math.round(r.retour) + " ans" : "—") + '</b><small>Retour sur investissement</small></div></div></div>';
}

function invAnalyse(p, res) {
  var B = state.invBudget, out = [];
  var label = invProjetLabel(p);
  if (!res.good.length) {
    var m = res.bad.filter(function(x) { return !x.r.raison; })[0];
    out.push("Avec " + fmt(B) + " FCFA, aucun quartier suivi ne permet « " + label + " » avec les réglages choisis." + (m ? " Le budget minimum observé est de " + fmtM(m.r.total) + " F à " + m.q.nom + "." : " Essayez une parcelle plus grande ou un autre projet."));
    return out;
  }
  out.push("« " + label + " » est réalisable dans " + res.good.length + " quartier" + (res.good.length > 1 ? "s" : "") + " sur " + VENTE_QUARTIERS.length + ".");
  if (p === "terrain") {
    var cheap = res.good[0];
    out.push("C'est à " + cheap.q.nom + " que ce budget achète le plus grand terrain (" + fmt(cheap.r.surface) + " m²).");
  } else {
    var best = res.good[0];
    var low = res.good.slice().sort(function(a, b) { return a.r.total - b.r.total; })[0];
    out.push("Le plus rentable : " + best.q.nom + " (rendement net " + invPct(best.r.rend) + ", retour ~" + Math.round(best.r.retour) + " ans). Le moins cher : " + low.q.nom + " (" + fmtM(low.r.total) + " F au total).");
    if (best.r.rend < 0.05) out.push("Rendement net inférieur à 5 % : avec ces coûts et ces loyers relevés, la location couvre lentement la construction. Vérifiez le coût réel avec un entrepreneur et le loyer visé pour un bien neuf (réglages ci-dessus).");
    else if (best.r.rend >= 0.08) out.push("Rendement net supérieur à 8 % : à confirmer sur le terrain, car il dépend beaucoup du coût réel de construction et du loyer obtenu.");
  }
  var nz = { "Extension / périphérie": 0, "Résidentiel établi": 0, "Centre / résidentiel prime": 0 };
  res.good.forEach(function(x) { nz[x.q.zone]++; });
  out.push("Disponibilité (indicative) : " + nz["Extension / périphérie"] + " quartier(s) en périphérie (terrains plus faciles à trouver), " + nz["Résidentiel établi"] + " en zone établie, " + nz["Centre / résidentiel prime"] + " en zone centrale (parcelles rares).");
  return out;
}

function screenInvest() {

  var hyp = '<div style="font-size:11.5px;color:var(--ink-soft);line-height:1.6">' +
    "<b>Prix du terrain</b> : médiane des relevés Terrimoine T3 2026 par quartier. <b>Frais d'acquisition</b> : +" + Math.round(INV_FRAIS_TERRAIN * 100) + " % du terrain (mutation, notaire, bornage, titre). " +
    "<b>Construction</b> : " + fmt(state.invCout) + " F par m² bâti + " + Math.round(INV_IMPREVUS * 100) + " % d'études, permis et imprévus (hypothèse à valider avec un entrepreneur). " +
    "<b>Villa</b> : 3, 4 ou 5 chambres = 110, 150 ou 200 m² bâtis, sur 60 % de la parcelle au maximum. " +
    "<b>Immeuble</b> : " + Math.round(INV_EMPRISE * 100) + " % de la parcelle bâtie au sol, appartements de " + INV_APPT_M2 + " m² (" + Math.round(INV_UTILE * 100) + " % de surface utile). " +
    "<b>Loyers</b> : médiane des relevés par quartier (édition pilote : 3 relevés par type de bien) × niveau choisi ; occupation " + Math.round(INV_OCCUP * 100) + " %, charges et entretien " + Math.round(INV_CHARGES * 100) + " %. " +
    "<b>Disponibilité</b> : indicative, déduite du type de zone, pas encore mesurée. " +

  var shareTxt = "Avec " + fmtM(B) + " F, que peut-on faire à Bamako ? Terrain, villa, immeuble R+1 à R+3 : quartier par quartier, avec la rentabilité. Fais ta simulation gratuite 👇";

  return '' +

    invOverview() +

    shareBtn(shareTxt, "Inviter un proche à simuler son budget", "budget=" + B) +

}

var DEV_NIVEAUX = ["RDC", "R+1", "R+2", "R+3"];

function fq(x, d) { var k = Math.pow(10, d); return (Math.round(x * k) / k).toString().replace(".", ","); }
function openDevis() { state.showDevis = true; render(); }
function closeDevis() { state.showDevis = false; render(); }
function devSet(field, v) { state[field] = v; invRefresh(); }
function devSetDim(field, v) {

  if (n > 100) n = 100;
  state[field] = n; state.devSurfCustom = 0; invRefresh();
}
function devSetPreset(l, p) { state.devL = l; state.devP = p; state.devSurfCustom = 0; invRefresh(); }
function devSetPct(x) { state.devPct = x; state.devSurfCustom = 0; invRefresh(); }
function devSetSurf(v) { var n = invNum(v); state.devSurfCustom = n < 20 ? 0 : Math.min(n, 2000); invRefresh(); }
function devSetPrix(key, v) { var n = invNum(v); if (n > 0) state.devPrix[key] = n; invRefresh(); }
function devResetPrix() { state.devPrix = JSON.parse(JSON.stringify(DEV_PRIX_DEFAUT)); invRefresh(); }

function devCalc() {
  var P = state.devPrix, n = state.devN, S = state.devL * state.devP;
  var a = state.devSurfCustom > 0 ? state.devSurfCustom : Math.max(20, Math.round(S * state.devPct));
  var A = a * n, h = 3.0;
  var fin = DEV_FINITION[state.devStanding];
  var perim = 4.057 * Math.sqrt(a);          // rectangle 1 : 1,4
  var lint = 0.45 * a;                        // murs intérieurs par niveau (m)
  var wallA = (perim + lint) * h * 0.85 * n;  // m² de murs, 15 % d'ouvertures déduits
  var agglos = Math.ceil(wallA * 12.5 * 1.05);
  var mortier = wallA * 0.03;
  var enduit = wallA * 2 * 0.02 + A * 0.015;
  var carrSurf = A * 0.9;
  var chape = carrSurf * 0.03;
  var sec = 0.15 + 0.05 * (n - 1);
  var vFond = (perim + 0.6 * lint) * 0.32 * (1 + 0.2 * (n - 1));
  var vPot = Math.ceil(a / 8) * sec * sec * (h * n + 0.5);
  var vPoutre = 2 * (perim + 0.8 * lint) * (n > 1 ? 0.06 : 0.03) * n;
  var vDallage = a * 0.10;
  var planchers = (n - 1) + (state.devToit === "terrasse" ? 1 : 0);
  var vDalle = planchers * a * 0.15;
  var vEsc = n > 1 ? (n - 1) * 1.5 : 0;
  var vLint = 0.005 * wallA;
  var beton = vFond + vPot + vPoutre + vDallage + vDalle + vEsc + vLint;
  var acier = vFond * 70 + vPot * 160 + vPoutre * 130 + vDallage * 30 + vDalle * 80 + vEsc * 120 + vLint * 130;
  var cimentKg = beton * 350 + mortier * 350 + enduit * 400 + chape * 350;
  var sable = (beton * 0.45 + mortier + enduit + chape) * 1.05;
  var gravier = beton * 0.85;
  var moellon = a * 0.2;
  var chambres = Math.max(1, Math.round(A / 30));
  var douches = Math.max(1, Math.round(chambres * 0.7));
  var portes = chambres + douches + 2 * n + 1;
  var fenetres = chambres + 2 * n + 1;

  var go = [], fi = [];
  function add(list, nom, qte, total) { list.push({ nom: nom, qte: qte, total: total }); }
  add(go, "Ciment CPJ45", fq(cimentKg / 1000, 1) + " t (≈ " + fmt(Math.ceil(cimentKg / 50)) + " sacs de 50 kg)", cimentKg / 1000 * P.ciment);
  var ferKgTot = 0;
  ["fer6", "fer8", "fer10", "fer12", "fer14"].forEach(function(k) {
    var kg = acier * DEV_FER_PART[k], barres = Math.ceil(kg / DEV_FER_KG[k]);
    ferKgTot += barres * DEV_FER_KG[k];
    add(go, "Fer " + (k === "fer6" ? "rond lisse Ø6" : "Tor Ø" + k.slice(3)), fmt(barres) + " barres de 12 m", barres * P[k]);
  });
  add(go, "Sable du fleuve", fq(sable, 1) + " m³ (≈ " + Math.ceil(sable / 10) + " voyages de 10 m³)", sable * P.sable);
  add(go, "Gravier du fleuve", fq(gravier, 1) + " m³ (≈ " + Math.ceil(gravier / 10) + " voyages de 10 m³)", gravier * P.gravier);
  add(go, "Agglos (parpaings) 15", fmt(agglos) + " unités", agglos * P.agglo);
  add(go, "Moellon (hérisson)", fq(moellon, 1) + " m³", moellon * P.moellon);
  var goSum = go.reduce(function(s, x) { return s + x.total; }, 0);
  add(go, "Divers gros œuvre (coffrage, fil d'attache, clous)", "8 % du gros œuvre", goSum * 0.08);

  var roofA = a * 1.25;
  if (state.devToit === "terrasse") add(fi, "Étanchéité de la terrasse", fmt(a) + " m²", a * P.terrasse);
  else add(fi, "Toiture en tôle (charpente + bac posé)", fmt(roofA) + " m²", roofA * P.tole);
  add(fi, "Carrelage (" + fin.label.toLowerCase() + ")", fmt(carrSurf * 1.1) + " m² (+10 % de chutes)", carrSurf * 1.1 * fin.carreau);
  var paintA = 2 * wallA + A;
  add(fi, "Peinture et enduits de finition", fmt(paintA) + " m²", paintA * fin.peinture);
  add(fi, "Portes", portes + " unités", portes * fin.porte);
  add(fi, "Fenêtres", fenetres + " unités", fenetres * fin.fenetre);
  add(fi, "Plomberie et sanitaires", douches + " douche(s)/WC + cuisine", douches * fin.sanitaire + 150000);
  add(fi, "Électricité", fmt(A) + " m²", A * fin.elec);

  var fiSum = fi.reduce(function(s, x) { return s + x.total; }, 0);
  var goTotal = goSum + goSum * 0.08;
  var mat = goTotal + fiSum;
  var mo = mat * P.mo / 100;
  var constr = mat + mo;
  var q = VENTE_QUARTIERS.filter(function(x) { return x.nom === state.devQuartier; })[0];
  var terrain = q ? q.prixM2 * S * (1 + INV_FRAIS_TERRAIN) : 0;
  return { S: S, a: a, A: A, n: n, go: go, fi: fi, goTotal: goTotal, fiSum: fiSum, mat: mat, mo: mo, constr: constr, perM2: constr / A,
           terrain: terrain, q: q, total: constr + terrain, cimentT: cimentKg / 1000, ferT: ferKgTot / 1000, sable: sable, gravier: gravier,
           beton: beton, agglos: agglos, chambres: chambres, douches: douches };
}

function proImpot() {
  var p = state.pro, tabs = [["loyers", "Loyers"], ["vente", "Vente"], ["achat", "Achat"]];
  var chips = invGrid(3, tabs.map(function(t) { return invChip(t[1], p.tabImpot === t[0], "proSet('tabImpot','" + t[0] + "')"); }).join(""));
  var body = "";
  if (p.tabImpot === "loyers") {
    var brut = p.loyer * p.mois, base = Math.max(0, brut * (1 - p.abatt / 100) - p.chargesDed), imp = base * p.tauxLoy / 100;
    body = pGrid(pIn("loyer", "Loyer mensuel (F)") + pIn("mois", "Mois loués dans l'année") + pIn("chargesDed", "Charges déductibles par an (F)") + pIn("abatt", "Abattement (%)", "dec") + pIn("tauxLoy", "Taux d'imposition (%)", "dec")) +
      '<div class="card">' + pLine("Loyers encaissés par an", fmt(brut) + " F") + pLine("Base imposable", fmt(base) + " F") + pLine("Impôt estimé par an", fmt(imp) + " F", true) + pLine("Revenu net après impôt (par mois)", fmt(Math.round((brut - p.chargesDed - imp) / 12)) + " F") + '</div>';
  } else if (p.tabImpot === "vente") {
    var pv = Math.max(0, p.pvVente - p.pvAchat - p.pvFrais), i2 = pv * p.tauxPv / 100;
    body = pGrid(pIn("pvAchat", "Prix d'achat (F)") + pIn("pvVente", "Prix de vente (F)") + pIn("pvFrais", "Frais et travaux justifiés (F)") + pIn("tauxPv", "Taux sur la plus-value (%)", "dec")) +
      '<div class="card">' + pLine("Plus-value", fmt(pv) + " F") + pLine("Impôt estimé", fmt(i2) + " F", true) + pLine("Gain net après impôt", fmt(pv - i2) + " F") + '</div>';
  } else {
    var fr = p.acPrix * p.tauxMut / 100;
    body = pGrid(pIn("acPrix", "Prix du bien (F)") + pIn("tauxMut", "Frais d'acquisition (%)", "dec")) +
      '<div class="card">' + pLine("Frais (mutation, notaire, titre)", fmt(fr) + " F") + pLine("Coût total d'achat", fmt(p.acPrix + fr) + " F", true) + '</div>';
  }
  return '<div class="sub">Estimez l\'impôt avant de louer, de vendre ou d\'acheter.</div>' + PRO_RATE_WARN + chips + '<div style="height:10px"></div>' + body +
    pNote("Simulation indicative. Elle ne remplace pas le calcul de l'administration fiscale ni l'avis d'un notaire ou d'un comptable.") +
    shareBtn("Combien d'impôt sur vos loyers ou votre vente de bien ? Simulez gratuitement sur Terrimoine 👇", "Inviter un proche à simuler", "impot");
}

function proRendement() {
  var p = state.pro, cout = p.rPrix * (1 + p.rFrais / 100), loyerAn = p.rLoyer * 12, loyerEff = loyerAn * (1 - p.rVac / 100);
  var charges = loyerEff * p.rCharges / 100 + p.rTaxe, net = loyerEff - charges;
  var brut = loyerAn / p.rPrix, rnet = net / cout;
  var emprunt = cout * (1 - p.rApport / 100), n = p.rDuree * 12, r = p.rTaux / 100 / 12;
  var men = emprunt <= 0 ? 0 : (r === 0 ? emprunt / n : emprunt * r / (1 - Math.pow(1 + r, -n)));
  var cf = net / 12 - men, mise = cout * p.rApport / 100;
  var cfLine = emprunt > 0 ? pLine("Mensualité de crédit", fmt(Math.round(men)) + " F") + pLine("Cash-flow mensuel", (cf < 0 ? "−" : "") + fmt(Math.abs(Math.round(cf))) + " F", true) : "";
  var verdict = rnet >= 0.08 ? "Rendement net élevé pour le marché" : rnet >= 0.05 ? "Rendement net correct" : "Rendement net faible : vérifiez le prix ou le loyer";
  return '<div class="sub">Mesurez ce que rapporte un bien avant de l\'acheter.</div>' +
    pGrid(pIn("rPrix", "Prix d'achat (F)") + pIn("rFrais", "Frais d'acquisition (%)", "dec") + pIn("rLoyer", "Loyer mensuel (F)") + pIn("rVac", "Vacance locative (%)", "dec") + pIn("rCharges", "Charges et gestion (% des loyers)", "dec") + pIn("rTaxe", "Taxes annuelles (F)") +
      pIn("rApport", "Part payée comptant (%)", "dec") + pIn("rTaux", "Taux du crédit (%)", "dec") + pIn("rDuree", "Durée du crédit (ans)")) +
    '<div class="result-box"><div class="result-label">RENDEMENT NET</div><div class="result-val">' + (rnet * 100).toFixed(1).replace(".", ",") + ' %</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">Brut ' + (brut * 100).toFixed(1).replace(".", ",") + ' % · ' + verdict + '</div></div>' +
    '<div class="card">' + pLine("Coût total d'acquisition", fmt(cout) + " F") + pLine("Loyers par an après vacance", fmt(Math.round(loyerEff)) + " F") + pLine("Charges et taxes par an", fmt(Math.round(charges)) + " F") + pLine("Revenu net par an", fmt(Math.round(net)) + " F") +
    pLine("Retour sur investissement", net > 0 ? fq(cout / net, 1) + " ans" : "n/a") + cfLine + (emprunt > 0 ? pLine("Votre apport", fmtM(mise) + " F") : "") + '</div>' +
    pNote("Rendement net = loyers moins vacance, charges et taxes, divisés par le coût total d'achat, avant impôt sur les revenus. Le cash-flow dépend de votre crédit.") +
    '<button onclick="state.showPro=false;openInvest()" style="width:100%;border:1px solid var(--bronze);background:none;color:var(--ink);font-size:13px;font-weight:600;border-radius:10px;padding:13px;cursor:pointer;margin-bottom:8px">Voir ce que mon budget permet de réaliser</button>' +
    shareBtn("Un bien à 25 M FCFA rapporte combien ? Calculez le rendement de votre projet immobilier gratuitement 👇", "Inviter un proche à calculer", "rendement");
}

function computeCalc() {
  var r = state.taux / 100 / 12, n = state.duree * 12, m;
  m = r === 0 ? state.montant / n : (state.montant * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  var total = m * n;
  return { mensualite: m, coutTotal: total, interets: total - state.montant };
}
function computeCapacite() {
  var mensualiteMax = state.revenu * 0.33;
  var r = state.taux / 100 / 12, n = state.duree * 12;
  var capacite = r === 0 ? mensualiteMax * n : mensualiteMax * (1 - Math.pow(1 + r, -n)) / r;
  return { mensualiteMax: mensualiteMax, capacite: capacite };
}

function modeTabs() {
  return '<div style="display:flex;gap:8px;margin-bottom:18px">' +
    '<button onclick="setCalcMode(\'mensualite\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bronze);background:' + (state.calcMode === "mensualite" ? "var(--bronze)" : "none") + ';color:' + (state.calcMode === "mensualite" ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12.5px;font-weight:600;cursor:pointer">Mensualité</button>' +
    '<button onclick="setCalcMode(\'capacite\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bronze);background:' + (state.calcMode === "capacite" ? "var(--bronze)" : "none") + ';color:' + (state.calcMode === "capacite" ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12.5px;font-weight:600;cursor:pointer">Capacité d\'emprunt</button>' +
  '</div>';
}

function screenCalculator() {
  if (state.calcMode === "capacite") {
    var cc = computeCapacite();
    return '' +
      modeTabs() +
      '<div class="sub">Estimation indicative, règle usuelle de 33% d\'endettement maximum.</div>' +
      '<div class="card">' +
        '<div class="field"><div class="field-row"><span>Revenu mensuel</span><b>' + fmt(state.revenu) + ' FCFA</b></div><input type="range" min="100000" max="3000000" step="25000" value="' + state.revenu + '" oninput="updateCalc(\'revenu\', this.value)"></div>' +
        '<div class="field"><div class="field-row"><span>Taux d\'intérêt annuel</span><b>' + state.taux + ' %</b></div><input type="range" min="4" max="15" step="0.1" value="' + state.taux + '" oninput="updateCalc(\'taux\', this.value)"></div>' +
        '<div class="field" style="margin-bottom:0"><div class="field-row"><span>Durée du prêt</span><b>' + state.duree + ' ans</b></div><input type="range" min="1" max="25" step="1" value="' + state.duree + '" oninput="updateCalc(\'duree\', this.value)"></div>' +
      '</div>' +
      '<div class="result-box"><div class="result-label">MONTANT EMPRUNTABLE ESTIMÉ</div><div class="result-val">' + fmt(cc.capacite) + ' FCFA</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">mensualité max. ' + fmt(cc.mensualiteMax) + ' FCFA</div></div>';
  }
  var c = computeCalc();
  return '' +
    modeTabs() +
    '<div class="sub">Estimation indicative — les conditions réelles varient selon la banque. Taux immobilier moyen constaté au Mali : autour de 9% pour les particuliers (BCEAO, 2024).</div>' +
    '<div class="card">' +
      '<div class="field"><div class="field-row"><span>Montant du prêt</span><b>' + fmt(state.montant) + ' FCFA</b></div><input type="range" min="1000000" max="150000000" step="500000" value="' + state.montant + '" oninput="updateCalc(\'montant\', this.value)"></div>' +
      '<div class="field"><div class="field-row"><span>Taux d\'intérêt annuel</span><b>' + state.taux + ' %</b></div><input type="range" min="4" max="15" step="0.1" value="' + state.taux + '" oninput="updateCalc(\'taux\', this.value)"></div>' +
      '<div class="field" style="margin-bottom:0"><div class="field-row"><span>Durée du prêt</span><b>' + state.duree + ' ans</b></div><input type="range" min="1" max="25" step="1" value="' + state.duree + '" oninput="updateCalc(\'duree\', this.value)"></div>' +
    '</div>' +
    '<div class="result-box"><div class="result-label">MENSUALITÉ ESTIMÉE</div><div class="result-val">' + fmt(c.mensualite) + ' FCFA</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">par mois</div></div>' +
    '<div class="grid2">' +
      '<div class="minicard"><b>' + fmt(c.coutTotal) + '</b><small>Coût total (FCFA)</small></div>' +
      '<div class="minicard"><b>' + fmt(c.interets) + '</b><small>Intérêts payés (FCFA)</small></div>' +
    '</div>' +
    shareBtn("Un prêt immobilier au Mali : quelle mensualité pour " + fmtM(state.montant) + " F sur " + state.duree + " ans ? Calcule la tienne gratuitement 👇", "Inviter un proche à calculer son prêt", "calcul") +
    '<div style="margin-top:14px">' + renderSponsor(SPONSOR_CALC, "Ce calcul est rendu possible par :") + '</div>';
}

function screenDiasporaSim() {
  var budget = BUDGETS.filter(function(b) { return b.key === state.diasporaBudget; })[0];
  var maxPrixM2 = budget.max / REF_SURFACE;
  var matches = VENTE_QUARTIERS.filter(function(q) { return q.prixM2 <= maxPrixM2; }).sort(function(a, b) { return b.prixM2 - a.prixM2; });
  var budgetBtns = BUDGETS.map(function(b) {
    var active = b.key === state.diasporaBudget;
    return '<button onclick="setDiasporaBudget(\'' + b.key + '\')" style="padding:10px 6px;border-radius:8px;border:1px solid var(--bronze);background:' + (active ? "var(--bronze)" : "none") + ';color:' + (active ? "var(--ink)" : "var(--ink-soft)") + ';font-size:11.5px;font-weight:600;cursor:pointer">' + b.label + '</button>';
  }).join("");
  var list = matches.length
    ? matches.map(function(q) {
        return '<div class="card row"><div><div class="quartier-name">' + q.nom + '</div><div style="font-size:10px;color:var(--ink-soft)">' + q.zone + '</div></div><div class="quartier-val">' + fmt(q.prixM2) + ' F/m²</div></div>';
      }).join("")
    : '<div style="font-size:13px;color:var(--ink-soft);font-style:italic;text-align:center;padding:20px 0">Aucun quartier suivi ne correspond à ce budget pour l\'instant.</div>';
  return '' +
    '<div class="sub">Budget total envisagé pour un terrain, estimation basée sur une surface de référence de ' + REF_SURFACE + ' m².</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">' + budgetBtns + '</div>' +
    '<div class="section-label" style="margin-top:0">Quartiers accessibles à ce budget</div>' +
    '<div style="margin-top:10px">' + list + '</div>' +
    '<a href="' + waLink("Bonjour, je suis de la diaspora et je veux en savoir plus sur l'investissement immobilier au Mali avec un budget de " + budget.label + ".") + '" target="_blank" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);border-radius:10px;padding:14px;margin-top:18px">Être accompagné(e) sur WhatsApp</a>';
}

function guideSection(title, text) {
  return '<div class="section-label" style="margin-top:22px">' + title + '</div><div style="font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin-top:8px">' + text + '</div>';
}
function guideStep(n, title, text) {
  return '<div class="card" style="display:flex;gap:12px;align-items:flex-start"><div style="font-family:\'Courier New\',monospace;font-size:16px;color:var(--bronze);font-weight:700;flex-shrink:0">' + n + '</div><div><div class="quartier-name" style="font-size:14.5px;margin-bottom:3px">' + title + '</div><div style="font-size:12.5px;color:var(--ink-soft);line-height:1.5">' + text + '</div></div></div>';
}

function screenGuideFoncier() {
  return '' +
    '<div class="sub">Comment passer d\'un titre précaire (provisoire) à un titre foncier définitif, selon le Code Domanial et Foncier du Mali.</div>' +

    guideSection("Les titres précaires, c\'est quoi ?", "Avant d\'obtenir un titre foncier — aujourd\'hui le seul titre de propriété pleinement reconnu et inattaquable — beaucoup de Maliens détiennent des titres dits précaires ou provisoires : lettre d\'attribution, permis d\'occuper, concession rurale ou urbaine, notification municipale. Historiquement délivrés par un maire, un préfet, un sous-préfet ou un chef de village, ces documents ne suffisent plus aujourd\'hui, seuls, à sécuriser pleinement une propriété.") +

    guideSection("Un changement important depuis 2021", "La réforme du Code Domanial et Foncier (loi n°2021-056 du 7 octobre 2021) a fixé une règle claire : les détenteurs de titres provisoires disposent d\'un délai de 10 ans pour les transformer en titre foncier. Depuis cette réforme, seul le titre foncier régulièrement établi est reconnu comme définitif et inattaquable devant les juridictions maliennes — et depuis les réformes domaniales les plus récentes, c\'est désormais le seul acte de propriété valable pour l\'acquisition d\'une parcelle.") +

    '<div class="section-label" style="margin-top:22px">Les étapes de la transformation</div>' +
    '<div style="display:grid;gap:10px;margin-top:10px">' +
      guideStep(1, "Constituer le dossier", "Demande timbrée (500 FCFA) adressée au Directeur Régional des Domaines et du Cadastre, accompagnée de la copie de l\'acte de propriété ou d\'attribution, d\'une copie de la CNI, et d\'un extrait du plan de situation de la parcelle.") +
      guideStep(2, "Réquisition d\'un géomètre agréé", "Le géomètre expert dresse le plan de délimitation de la parcelle et le procès-verbal de bornage.") +
      guideStep(3, "Publication & délai d\'opposition", "Un avis de demande d\'immatriculation est publié ; un délai de 30 jours permet à tout tiers de faire valoir une contestation ou un droit sur la parcelle.") +
      guideStep(4, "Création du titre foncier", "En l\'absence d\'opposition fondée, le titre foncier est établi sur les livres fonciers, au nom du titulaire, à la conservation foncière compétente.") +
    '</div>' +

    guideSection("Coûts et délais indicatifs", "Droit d\'enregistrement : 15% du prix de la parcelle. Droit de mutation : 0,9%. Délai réglementaire : jusqu\'à 6 mois selon les textes en vigueur. Ces montants peuvent évoluer — vérifie-les auprès des Domaines au moment de ta démarche.") +

    guideSection("Et le Guichet Unique du Foncier ?", "Depuis 2025, l\'État a engagé une simplification de cette procédure via le Système d\'Informations Foncières et son Guichet Unique du Foncier (SIF/GUF), avec une volonté affichée de réduire les coûts et d\'accélérer les démarches, zone par zone — déjà actif dans les sept arrondissements de Bamako.") +

    '<div class="card flat" style="margin-top:22px"><div style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px"><b style="color:var(--ink)">À retenir :</b> ce guide est informatif, pas un conseil juridique personnalisé. Chaque dossier a ses particularités — un notaire, un agent des Domaines et du Cadastre, ou Terrimoine Conseil peuvent t\'accompagner sur ton cas précis.</div><a href="' + waLink("Bonjour, j'ai besoin d'aide pour transformer mon titre précaire en titre foncier.") + '" target="_blank" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);border-radius:8px;padding:10px">Être accompagné(e) sur WhatsApp</a></div>';
}

function screenPublicite() {
  return '' +
    '<div class="sub">Banques, agences, promoteurs, entreprises de BTP — une visibilité auprès de l\'audience Terrimoine : professionnels de l\'immobilier, investisseurs, et diaspora malienne.</div>' +
    '<div class="card"><div class="quartier-name" style="margin-bottom:8px">Nos règles, sans exception</div>' +
      '<div style="font-size:13px;color:var(--ink-soft);line-height:1.8">' +
        '• Toujours étiqueté « Sponsorisé », jamais confondu avec nos données<br>' +
        '• Même tarif pour tous, aucun traitement de faveur<br>' +
        '• Zéro influence sur les prix ou analyses du Rapport Trimestriel<br>' +
        '• L\'Annuaire reste un répertoire ouvert, sans classement payant' +
      '</div>' +
    '</div>' +
    '<div class="card"><div class="quartier-name" style="margin-bottom:8px">Formats disponibles</div>' +
      '<div style="font-size:13px;color:var(--ink-soft);line-height:1.6">Carte sponsorisée sur l\'Accueil ou l\'onglet Quartiers — visible, mais toujours distincte du contenu éditorial.</div>' +
    '</div>' +
    '<div class="card flat" style="text-align:center">' +
      '<div class="quartier-name" style="font-size:14.5px;margin-bottom:6px">Intéressé ?</div>' +
      '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px">Discutons de vos besoins et des disponibilités.</div>' +
      '<a href="' + waLink("Bonjour, je souhaite en savoir plus sur l'espace publicitaire Terrimoine.") + '" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);border-radius:8px;padding:10px 18px">Nous contacter sur WhatsApp</a>' +
    '</div>';
}

var TABS = [
  { key: "home", label: "Accueil", icon: "home", fn: screenHome },
  { key: "rapport", label: "Rapport", icon: "file", fn: screenRapport },
  { key: "quartiers", label: "Quartiers", icon: "map", fn: screenQuartiers },
  { key: "annuaire", label: "Annuaire", icon: "users", fn: screenAnnuaire },
  { key: "plus", label: "Plus", icon: "more", fn: screenPlus }
];

function render() {
  setTimeout(trackScreen, 0);
  var app = document.getElementById("app");
  if (state.showCalc) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeCalc()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Calculateur de prêt</div></div></div>' +
      '<div class="content"><div class="screen">' + screenCalculator() + '</div></div>';
    return;
  }
  if (state.showDiasporaSim) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeDiasporaSim()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Simulateur Diaspora</div></div></div>' +
      '<div class="content"><div class="screen">' + screenDiasporaSim() + '</div></div>';
    return;
  }
  if (state.showSvc) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="svcBack()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">' + svcTitle() + '</div></div></div>' +
      '<div class="content"><div class="screen">' + screenSvc() + '</div></div>';
    return;
  }
  if (state.showPro) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="proBack()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">' + proTitle() + '</div></div></div>' +
      '<div class="content"><div class="screen">' + screenPro() + '</div></div>';
    return;
  }
  if (state.showDevis) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeDevis()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Devis matériaux</div></div></div>' +
      '<div class="content"><div class="screen">' + screenDevis() + '</div></div>';
    return;
  }
  if (state.showVerif) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeVerif()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Vérifier un terrain</div></div></div>' +
      '<div class="content"><div class="screen">' + screenVerif() + '</div></div>';
    return;
  }
  if (state.showInvest) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeInvest()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Mon budget</div></div></div>' +
      '<div class="content"><div class="screen">' + screenInvest() + '</div></div>';
    return;
  }
  if (state.showGuideFoncier) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeGuideFoncier()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Titre foncier</div></div></div>' +
      '<div class="content"><div class="screen">' + screenGuideFoncier() + '</div></div>';
    return;
  }
  if (state.showPublicite) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closePublicite()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Espace publicitaire</div></div></div>' +
      '<div class="content"><div class="screen">' + screenPublicite() + '</div></div>';
    return;
  }
  var active = TABS.filter(function(t) { return t.key === state.tab; })[0];
  var navHtml = TABS.map(function(t) {
    var isActive = t.key === state.tab;
    return '<button class="navbtn' + (isActive ? ' active' : '') + '" onclick="setTab(\'' + t.key + '\')">' + icon(t.icon, 21, isActive ? "#A67C3D" : "#6B5B4D") + '<span>' + t.label + '</span></button>';
  }).join("");
  app.innerHTML =
    '<div class="topbar">' + logoMark(30) + '<div><div class="eyebrow">TERRIMOINE</div><div class="title">' + TITLES[state.tab] + '</div></div></div>' +
    '<div class="content"><div class="screen">' + active.fn() + '</div></div>' +
    '<div class="bottomnav">' + navHtml + '</div>';
}

// ---------- mesure d'audience (Google Analytics) ----------
var _lastScreen = "";
function currentScreen() {
  if (state.showCalc) return "calculateur";
  if (state.showSvc) return "services-" + (state.svcView || "hub");
  if (state.showPro) return "pro-" + (state.proView || "hub");
  if (state.showDevis) return "devis-materiaux";
  if (state.showVerif) return "verifier-terrain";
  if (state.showInvest) return "simulateur-budget";
  if (state.showDiasporaSim) return "simulateur-diaspora";
  if (state.showGuideFoncier) return "guide-titre-foncier";
  if (state.showPublicite) return "espace-publicitaire";
  return state.tab;
}
function trackScreen() {
  try {
    var sc = currentScreen();
    if (sc === _lastScreen) return;
    _lastScreen = sc;
    gtag('event', 'page_view', { page_title: sc, page_location: location.origin + '/#' + sc });
  } catch (e) {}
}
document.addEventListener('click', function(e) {
  try {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a || !a.href) return;
    if (a.href.indexOf('wa.me/?text') > -1) gtag('event', 'partage_whatsapp', { ecran: currentScreen() });
    else if (a.href.indexOf('.pdf') > -1) gtag('event', 'telechargement_rapport', { ecran: currentScreen() });
    else if (a.href.indexOf('wa.me') > -1) gtag('event', 'clic_whatsapp', { ecran: currentScreen() });
    else if (a.href.indexOf('youtube') > -1) gtag('event', 'clic_video', { ecran: currentScreen() });
    else if (a.target === '_blank' && a.href.indexOf(location.host) === -1) gtag('event', 'clic_sponsor', { ecran: currentScreen(), lien: a.href.slice(0, 100) });
  } catch (err) {}
});

function applyHash() {
  try {
    var h = (location.hash || "").replace("#", "");
    if (!h) return;
    var parts = h.split("=");
    var key = parts[0];
    if (key === "budget") {
      var n = invNum(parts[1]);
      if (n >= 1000000) state.invBudget = Math.min(n, 5000000000);
      state.showInvest = true;
    } else if (key === "devis") {
      var d = (parts[1] || "").split(",").map(Number);
      if (d[0] >= 20 && d[0] <= 2000) state.devSurfCustom = d[0];
      if (d[1] >= 1 && d[1] <= 4) state.devN = d[1];
      if (d[2] >= 4 && d[2] <= 100) state.devL = d[2];
      if (d[3] >= 4 && d[3] <= 100) state.devP = d[3];
      state.showDevis = true;
    } else if (["pro","frais","impot","rendement","patrimoine","premium","boutique"].indexOf(key) > -1) {
      proInit(); state.showPro = true; state.proView = key === "pro" ? "hub" : key;
    } else if (key === "services") {
      state.showSvc = true; state.svcView = "hub";
    } else if (key === "guide") {
      state.showSvc = true; state.svcView = "guide"; state.svcId = parts[1] === "diaspora" ? "guide_diaspora" : "guide_tf";
    } else if (key === "verif") {
      state.showVerif = true;
    } else if (key === "calcul") {
      state.showCalc = true;
    } else if (TITLES[key]) {
      state.tab = key;
    } else { return; }
    gtag("event", "arrivee_lien_partage", { cible: key });
  } catch (e) {}
}
applyHash();
render();
trackScreen();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function() {});
  });
}
</script>
