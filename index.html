<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Terrimoine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#3E2723" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior-y: none; }
  #root { height: 100%; }
  ::-webkit-scrollbar { display: none; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #E6DBC3; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #A67C3D; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const INK = "#3E2723";
const BRONZE = "#A67C3D";
const PAPER = "#F1EAD9";
const PAPER_DEEP = "#E6DBC3";
const INK_SOFT = "#6B5B4D";
const DISPLAY = "'Zilla Slab', 'Roboto Slab', Georgia, serif";
const BODY = "'IBM Plex Sans', 'Segoe UI', Arial, sans-serif";
const MONO = "'IBM Plex Mono', 'Courier New', monospace";

function Icon({ children, size = 22, color = "currentColor", strokeWidth = 1.8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
         strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {children}
    </svg>
  );
}
const HomeIcon = (p) => <Icon {...p}><path d="M4 11.5L12 4l8 7.5" /><path d="M6 10v10h12V10" /></Icon>;
const FileIcon = (p) => <Icon {...p}><path d="M6 2h9l5 5v15H6z" /><line x1="9" y1="12" x2="17" y2="12" /><line x1="9" y1="16" x2="17" y2="16" /></Icon>;
const MapIcon = (p) => <Icon {...p}><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></Icon>;
const UsersIcon = (p) => <Icon {...p}><circle cx="9" cy="8" r="3.2" /><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6" /><circle cx="17" cy="9" r="2.6" /><path d="M15.5 14c2.7.3 4.5 2.4 4.5 6" /></Icon>;
const MoreIcon = (p) => <Icon {...p}><circle cx="5" cy="12" r="1.4" fill="currentColor" /><circle cx="12" cy="12" r="1.4" fill="currentColor" /><circle cx="19" cy="12" r="1.4" fill="currentColor" /></Icon>;
const GlobeIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><line x1="3" y1="12" x2="21" y2="12" /></Icon>;
const ShieldIcon = (p) => <Icon {...p}><path d="M12 2l8 3.5v6C20 17 16.5 20.5 12 22c-4.5-1.5-8-5-8-10.5v-6z" /><polyline points="8.5 12 11 14.5 15.5 9.5" /></Icon>;
const DownloadIcon = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 11 12 16 17 11" /><path d="M5 19h14" /></Icon>;
const ChevronIcon = (p) => <Icon {...p}><polyline points="9 6 15 12 9 18" /></Icon>;
const CalcIcon = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2" /><line x1="8" y1="6" x2="16" y2="6" /><line x1="8" y1="11" x2="8" y2="11.01" /><line x1="12" y1="11" x2="12" y2="11.01" /><line x1="16" y1="11" x2="16" y2="11.01" /><line x1="8" y1="15" x2="8" y2="15.01" /><line x1="12" y1="15" x2="12" y2="15.01" /><line x1="16" y1="15" x2="16" y2="15.01" /></Icon>;
const BackIcon = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6" /></Icon>;

const ZONES = [
  { name: "Centre / résidentiel prime", quartiers: [
    { nom: "ACI 2000", val: "380 000", note: "loyer moyen FCFA/mois" },
    { nom: "Badalabougou", val: "650 000", note: "loyer moyen FCFA/mois" },
    { nom: "Hamdallaye ACI", val: null, note: "collecte en cours" },
    { nom: "Niaréla", val: null, note: "collecte en cours" },
  ]},
  { name: "Résidentiel établi", quartiers: [
    { nom: "Sotuba", val: "300 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Sébénikoro", val: null, note: "collecte en cours" },
    { nom: "Djicoroni Para", val: null, note: "collecte en cours" },
  ]},
  { name: "Extension / périphérie", quartiers: [
    { nom: "Yirimadio", val: "210 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Faladié", val: "130 000", note: "loyer moyen FCFA/mois" },
    { nom: "Kalaban Coura", val: null, note: "collecte en cours" },
  ]},
];

const REPORT_SECTIONS = [
  "Synthèse exécutive", "Contexte macro-économique", "Marché résidentiel de Bamako",
  "Foncier & actualité réglementaire", "Diaspora & investissement", "Perspectives", "Méthodologie & sources",
];

const PROS = [
  { icon: UsersIcon, label: "Agences immobilières", note: "annuaire ouvert, sans classement payant" },
  { icon: ShieldIcon, label: "Notaires", note: "vérification des actes" },
  { icon: MapIcon, label: "Géomètres agréés", note: "bornage & délimitation" },
  { icon: FileIcon, label: "Agents des Domaines", note: "titres & cadastre" },
];

function TopBar({ title, onBack }) {
  return (
    <div style={{
      background: INK, color: PAPER, padding: "18px 20px 14px",
      position: "sticky", top: 0, zIndex: 10, borderBottom: `1px solid ${BRONZE}`,
      display: "flex", alignItems: "center", gap: "10px",
    }}>
      {onBack && (
        <button onClick={onBack} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", color: PAPER }}>
          <BackIcon size={20} />
        </button>
      )}
      <div>
        <div style={{ fontFamily: MONO, fontSize: "10px", letterSpacing: "2px", color: BRONZE, marginBottom: "2px" }}>TERRIMOINE</div>
        <div style={{ fontFamily: DISPLAY, fontSize: "21px" }}>{title}</div>
      </div>
    </div>
  );
}

function Card({ children, style, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: "#fff", border: `1px solid ${PAPER_DEEP}`, borderRadius: "10px", padding: "16px",
      cursor: onClick ? "pointer" : "default", ...style,
    }}>
      {children}
    </div>
  );
}

function Stat({ label, value }) {
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ fontFamily: MONO, fontSize: "20px", color: BRONZE, fontWeight: 700 }}>{value}</div>
      <div style={{ fontSize: "10.5px", color: INK_SOFT, marginTop: "2px" }}>{label}</div>
    </div>
  );
}

function PrimaryButton({ children, icon: IconComp, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: "100%", fontFamily: BODY, fontSize: "15px", fontWeight: 600,
      background: BRONZE, color: INK, border: "none", borderRadius: "10px",
      padding: "15px", display: "flex", alignItems: "center", justifyContent: "center", gap: "8px", cursor: "pointer",
    }}>
      {children}{IconComp && <IconComp size={17} />}
    </button>
  );
}

function fmt(n) {
  return Math.round(n).toLocaleString("fr-FR").replace(/,/g, " ").replace(/\u00A0/g, " ");
}

function HomeScreen({ openCalc }) {
  return (
    <div style={{ padding: "18px" }}>
      <div style={{ fontFamily: DISPLAY, fontSize: "24px", color: INK, marginBottom: "6px", lineHeight: 1.2 }}>
        Le marché immobilier malien, enfin mesuré.
      </div>
      <div style={{ fontSize: "13.5px", color: INK_SOFT, marginBottom: "20px", lineHeight: 1.5 }}>
        Rapports trimestriels indépendants, données vérifiées, aucune agence favorisée.
      </div>
      <Card style={{ display: "flex", justifyContent: "space-around", marginBottom: "16px" }}>
        <Stat label="Quartiers suivis" value="24" />
        <Stat label="Publication" value="Trimestrielle" />
        <Stat label="Sources" value="INSTAT·BCEAO" />
      </Card>
      <div style={{ display: "grid", gap: "10px" }}>
        <PrimaryButton icon={DownloadIcon}>Dernier rapport trimestriel</PrimaryButton>
        <Card onClick={openCalc} style={{ display: "flex", alignItems: "center", gap: "12px", background: PAPER_DEEP, border: "none" }}>
          <CalcIcon size={20} color={INK} />
          <div style={{ fontFamily: DISPLAY, fontSize: "14.5px", color: INK }}>Calculateur de prêt immobilier</div>
          <ChevronIcon size={16} color={INK_SOFT} style={{ marginLeft: "auto" }} />
        </Card>
      </div>
      <div style={{ marginTop: "22px", fontFamily: MONO, fontSize: "11px", letterSpacing: "1.5px", color: BRONZE, textTransform: "uppercase" }}>Aperçu quartiers</div>
      <div style={{ display: "grid", gap: "10px", marginTop: "10px" }}>
        {ZONES[0].quartiers.slice(0, 2).map((q) => (
          <Card key={q.nom} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontFamily: DISPLAY, fontSize: "15px" }}>{q.nom}</div>
            <div style={{ fontFamily: MONO, fontSize: "13px", color: q.val ? BRONZE : INK_SOFT, fontStyle: q.val ? "normal" : "italic" }}>
              {q.val ? q.val + " F" : q.note}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function RapportScreen() {
  return (
    <div style={{ padding: "18px" }}>
      <div style={{ background: INK, color: PAPER, borderRadius: "10px", padding: "22px", marginBottom: "18px" }}>
        <div style={{ fontFamily: MONO, fontSize: "10px", letterSpacing: "2px", color: BRONZE, marginBottom: "8px" }}>ÉDITION EN COURS</div>
        <div style={{ fontFamily: DISPLAY, fontSize: "19px", lineHeight: 1.3 }}>Rapport Trimestriel du Marché Immobilier du Mali</div>
      </div>
      <div style={{ display: "grid", gap: "8px", marginBottom: "20px" }}>
        {REPORT_SECTIONS.map((s, i) => (
          <div key={s} style={{ display: "flex", alignItems: "center", gap: "10px", fontSize: "14px", padding: "6px 0" }}>
            <span style={{ fontFamily: MONO, color: BRONZE, fontSize: "12px" }}>{String(i + 1).padStart(2, "0")}</span>
            <span>{s}</span>
          </div>
        ))}
      </div>
      <PrimaryButton icon={DownloadIcon}>Télécharger gratuitement</PrimaryButton>
    </div>
  );
}

function QuartiersScreen() {
  return (
    <div style={{ padding: "18px" }}>
      <div style={{ fontSize: "13px", color: INK_SOFT, marginBottom: "18px", lineHeight: 1.5 }}>
        Suivi trimestre après trimestre à partir des annonces et du réseau terrain.
      </div>
      {ZONES.map((zone) => (
        <div key={zone.name} style={{ marginBottom: "18px" }}>
          <div style={{ fontFamily: MONO, fontSize: "11px", letterSpacing: "1px", color: BRONZE, marginBottom: "8px", textTransform: "uppercase" }}>
            {zone.name}
          </div>
          <div style={{ display: "grid", gap: "8px" }}>
            {zone.quartiers.map((q) => (
              <Card key={q.nom} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontFamily: DISPLAY, fontSize: "15px" }}>{q.nom}</div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontFamily: MONO, fontSize: "14px", color: q.val ? BRONZE : INK_SOFT, fontStyle: q.val ? "normal" : "italic", fontWeight: q.val ? 700 : 400 }}>
                    {q.val || "—"}
                  </div>
                  <div style={{ fontSize: "10px", color: INK_SOFT }}>{q.note}</div>
                </div>
              </Card>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function AnnuaireScreen() {
  return (
    <div style={{ padding: "18px" }}>
      <div style={{ fontSize: "13px", color: INK_SOFT, marginBottom: "18px", lineHeight: 1.5 }}>
        Un répertoire ouvert, pas un classement payant.
      </div>
      <div style={{ display: "grid", gap: "10px" }}>
        {PROS.map(({ icon: IconComp, label, note }) => (
          <Card key={label} style={{ display: "flex", alignItems: "center", gap: "14px" }}>
            <IconComp size={24} color={BRONZE} strokeWidth={1.5} />
            <div>
              <div style={{ fontFamily: DISPLAY, fontSize: "15px" }}>{label}</div>
              <div style={{ fontSize: "12px", color: INK_SOFT }}>{note}</div>
            </div>
          </Card>
        ))}
      </div>
      <div style={{ marginTop: "16px", fontSize: "12px", color: INK_SOFT, fontStyle: "italic", textAlign: "center" }}>
        Annuaire en construction — rejoindre la première liste.
      </div>
    </div>
  );
}

function PlusScreen({ openCalc }) {
  return (
    <div style={{ padding: "18px" }}>
      <Card onClick={openCalc} style={{ marginBottom: "14px", display: "flex", alignItems: "center", gap: "14px" }}>
        <CalcIcon size={22} color={BRONZE} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: DISPLAY, fontSize: "16px" }}>Calculateur de prêt</div>
          <div style={{ fontSize: "12px", color: INK_SOFT }}>Mensualité, coût total, intérêts</div>
        </div>
        <ChevronIcon size={16} color={INK_SOFT} />
      </Card>
      <Card style={{ marginBottom: "14px" }}>
        <GlobeIcon size={22} color={BRONZE} />
        <div style={{ fontFamily: DISPLAY, fontSize: "16px", margin: "10px 0 6px" }}>Diaspora</div>
        <div style={{ fontSize: "13px", color: INK_SOFT, lineHeight: 1.5 }}>
          ~700 milliards FCFA transférés vers le Mali en 2023. Terrimoine donne à la diaspora la même information que quelqu'un sur place.
        </div>
      </Card>
      <Card style={{ marginBottom: "14px" }}>
        <ShieldIcon size={22} color={BRONZE} />
        <div style={{ fontFamily: DISPLAY, fontSize: "16px", margin: "10px 0 6px" }}>Méthodologie</div>
        <div style={{ fontSize: "13px", color: INK_SOFT, lineHeight: 1.5 }}>
          INSTAT, BCEAO, CAHF, prix de marché suivis, réseau terrain — chaque chiffre indique sa source.
        </div>
      </Card>
      <Card>
        <div style={{ fontFamily: DISPLAY, fontSize: "16px", marginBottom: "8px" }}>Contact</div>
        <div style={{ fontSize: "13px", color: INK_SOFT, lineHeight: 1.9 }}>
          Hamdallaye, Bamako, Mali — Rue 93, Porte 119<br />
          WhatsApp +223 82 68 35 41<br />
          terrimoine.com
        </div>
      </Card>
    </div>
  );
}

function Slider({ label, value, onChange, min, max, step, suffix }) {
  return (
    <div style={{ marginBottom: "20px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px" }}>
        <span style={{ fontSize: "13px", color: INK_SOFT }}>{label}</span>
        <span style={{ fontFamily: MONO, fontSize: "14px", color: INK, fontWeight: 700 }}>{value}{suffix}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
             onChange={(e) => onChange(Number(e.target.value))} style={{ width: "100%" }} />
    </div>
  );
}

function CalculatorScreen() {
  const [montant, setMontant] = useState(20000000);
  const [taux, setTaux] = useState(9);
  const [duree, setDuree] = useState(10);

  const { mensualite, coutTotal, interets } = useMemo(() => {
    const r = taux / 100 / 12;
    const n = duree * 12;
    const m = r === 0 ? montant / n : (montant * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    const total = m * n;
    return { mensualite: m, coutTotal: total, interets: total - montant };
  }, [montant, taux, duree]);

  return (
    <div style={{ padding: "18px" }}>
      <div style={{ fontSize: "13px", color: INK_SOFT, marginBottom: "22px", lineHeight: 1.5 }}>
        Estimation indicative — les conditions réelles varient selon la banque. Taux immobilier moyen constaté au Mali : autour de 9% pour les particuliers (BCEAO, 2024).
      </div>

      <Card style={{ marginBottom: "20px" }}>
        <Slider label="Montant du prêt" value={montant} onChange={setMontant} min={1000000} max={150000000} step={500000} suffix=" FCFA" />
        <Slider label="Taux d'intérêt annuel" value={taux} onChange={setTaux} min={4} max={15} step={0.1} suffix=" %" />
        <Slider label="Durée du prêt" value={duree} onChange={setDuree} min={1} max={25} step={1} suffix=" ans" />
      </Card>

      <div style={{ background: INK, color: PAPER, borderRadius: "10px", padding: "22px", textAlign: "center", marginBottom: "14px" }}>
        <div style={{ fontFamily: MONO, fontSize: "11px", letterSpacing: "1.5px", color: BRONZE, marginBottom: "8px" }}>MENSUALITÉ ESTIMÉE</div>
        <div style={{ fontFamily: DISPLAY, fontSize: "32px" }}>{fmt(mensualite)} FCFA</div>
        <div style={{ fontSize: "12px", color: "rgba(241,234,217,0.7)", marginTop: "4px" }}>par mois</div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
        <Card style={{ textAlign: "center" }}>
          <div style={{ fontFamily: MONO, fontSize: "16px", color: BRONZE, fontWeight: 700 }}>{fmt(coutTotal)}</div>
          <div style={{ fontSize: "11px", color: INK_SOFT, marginTop: "4px" }}>Coût total (FCFA)</div>
        </Card>
        <Card style={{ textAlign: "center" }}>
          <div style={{ fontFamily: MONO, fontSize: "16px", color: BRONZE, fontWeight: 700 }}>{fmt(interets)}</div>
          <div style={{ fontSize: "11px", color: INK_SOFT, marginTop: "4px" }}>Intérêts payés (FCFA)</div>
        </Card>
      </div>
    </div>
  );
}

const TABS = [
  { key: "home", label: "Accueil", icon: HomeIcon, screen: HomeScreen },
  { key: "rapport", label: "Rapport", icon: FileIcon, screen: RapportScreen },
  { key: "quartiers", label: "Quartiers", icon: MapIcon, screen: QuartiersScreen },
  { key: "annuaire", label: "Annuaire", icon: UsersIcon, screen: AnnuaireScreen },
  { key: "plus", label: "Plus", icon: MoreIcon, screen: PlusScreen },
];
const TITLES = { home: "Accueil", rapport: "Rapport Trimestriel", quartiers: "Prix par quartier", annuaire: "Professionnels", plus: "Plus" };

function App() {
  const [tab, setTab] = useState("home");
  const [showCalc, setShowCalc] = useState(false);
  const Active = TABS.find((t) => t.key === tab).screen;

  if (showCalc) {
    return (
      <div style={{ fontFamily: BODY, background: PAPER, minHeight: "100%", display: "flex", flexDirection: "column" }}>
        <TopBar title="Calculateur de prêt" onBack={() => setShowCalc(false)} />
        <div style={{ flex: 1, overflowY: "auto", paddingBottom: "24px" }}>
          <CalculatorScreen />
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: BODY, background: PAPER, minHeight: "100%", display: "flex", flexDirection: "column" }}>
      <TopBar title={TITLES[tab]} />
      <div style={{ flex: 1, overflowY: "auto", paddingBottom: "70px" }}>
        <Active openCalc={() => setShowCalc(true)} />
      </div>
      <div style={{
        position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff",
        borderTop: `1px solid ${PAPER_DEEP}`, display: "flex", paddingBottom: "env(safe-area-inset-bottom)",
      }}>
        {TABS.map(({ key, label, icon: IconComp }) => {
          const active = tab === key;
          return (
            <button key={key} onClick={() => setTab(key)} style={{
              flex: 1, background: "none", border: "none", padding: "9px 4px 8px",
              display: "flex", flexDirection: "column", alignItems: "center", gap: "3px", cursor: "pointer",
            }}>
              <IconComp size={21} color={active ? BRONZE : INK_SOFT} strokeWidth={active ? 2.1 : 1.7} />
              <span style={{ fontSize: "10px", color: active ? BRONZE : INK_SOFT, fontWeight: active ? 700 : 400 }}>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
