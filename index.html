<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Terrimoine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#3E2723" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root {
    --ink: #3E2723; --bronze: #A67C3D; --paper: #F1EAD9; --paper-deep: #E6DBC3; --ink-soft: #6B5B4D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior-y: none; font-family: 'Segoe UI', Arial, sans-serif; background: var(--paper); color: var(--ink); }
  #app { min-height: 100%; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { display: none; }
  .topbar { background: var(--ink); color: var(--paper); padding: 16px 20px 14px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--bronze); display: flex; align-items: center; gap: 12px; }
  .topbar .eyebrow { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 2px; color: var(--bronze); margin-bottom: 2px; }
  .topbar .title { font-family: Georgia, serif; font-size: 21px; }
  .backbtn { background: none; border: none; padding: 0; cursor: pointer; color: var(--paper); }
  .content { flex: 1; overflow-y: auto; padding-bottom: 70px; }
  .screen { padding: 18px; }
  .card { background: #fff; border: 1px solid var(--paper-deep); border-radius: 10px; padding: 16px; margin-bottom: 10px; }
  .card.flat { background: var(--paper-deep); border: none; }
  .card.clickable { cursor: pointer; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .row-start { display: flex; align-items: center; gap: 14px; }
  h1.hero { font-family: Georgia, serif; font-size: 24px; margin: 0 0 6px; line-height: 1.2; }
  .sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.5; }
  .stats { display: flex; justify-content: space-around; }
  .stat-val { font-family: 'Courier New', monospace; font-size: 20px; color: var(--bronze); font-weight: 700; text-align: center; }
  .stat-label { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; text-align: center; }
  .btn-primary { width: 100%; font-size: 15px; font-weight: 600; background: var(--bronze); color: var(--ink); border: none; border-radius: 10px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 10px; }
  .section-label { margin-top: 22px; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1.5px; color: var(--bronze); text-transform: uppercase; }
  .quartier-name { font-family: Georgia, serif; font-size: 15px; }
  .quartier-val { font-family: 'Courier New', monospace; font-size: 13px; color: var(--bronze); }
  .quartier-val.empty { color: var(--ink-soft); font-style: italic; }
  .report-cover { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 22px; margin-bottom: 18px; }
  .report-num { font-family: 'Courier New', monospace; color: var(--bronze); font-size: 12px; margin-right: 10px; }
  .pro-icon { color: var(--bronze); flex-shrink: 0; }
  .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--paper-deep); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .navbtn { flex: 1; background: none; border: none; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: var(--ink-soft); }
  .navbtn.active { color: var(--bronze); font-weight: 700; }
  .navbtn span { font-size: 10px; }
  .videowrap { margin-bottom: 16px; border-radius: 10px; overflow: hidden; background: var(--ink); position: relative; padding-top: 177.7%; }
  .videowrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .field { margin-bottom: 20px; }
  .field-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--ink-soft); }
  .field-row b { font-family: 'Courier New', monospace; font-size: 14px; color: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--paper-deep); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--bronze); cursor: pointer; }
  .result-box { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 22px; text-align: center; margin-bottom: 14px; }
  .result-label { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1.5px; color: var(--bronze); margin-bottom: 8px; }
  .result-val { font-family: Georgia, serif; font-size: 32px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .minicard { background: #fff; border: 1px solid var(--paper-deep); border-radius: 10px; padding: 16px; text-align: center; }
  .minicard b { font-family: 'Courier New', monospace; font-size: 16px; color: var(--bronze); display: block; }
  .minicard small { font-size: 11px; color: var(--ink-soft); margin-top: 4px; display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
var ZONES = [
  { name: "Centre / résidentiel prime", quartiers: [
    { nom: "ACI 2000", val: "380 000", note: "loyer moyen FCFA/mois" },
    { nom: "Badalabougou", val: "145 417", note: "loyer moyen FCFA/mois" },
    { nom: "Hamdallaye ACI", val: "525 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Niaréla", val: null, note: "collecte en cours" }
  ]},
  { name: "Résidentiel établi", quartiers: [
    { nom: "Sotuba", val: "150 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Sébénikoro", val: "97 500", note: "prix médian FCFA/m² (vente)" },
    { nom: "Bamako Coura", val: "200 000", note: "prix médian FCFA/m² (vente)" }
  ]},
  { name: "Extension / périphérie", quartiers: [
    { nom: "Yirimadio", val: "30 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Faladié", val: "60 000", note: "prix médian FCFA/m² (vente)" },
    { nom: "Sirakoro", val: "30 000", note: "prix médian FCFA/m² (vente)" }
  ]}
];
var REPORT_SECTIONS = ["Synthèse exécutive","Contexte macro-économique","Marché résidentiel de Bamako","Foncier & actualité réglementaire","Diaspora & investissement","Perspectives","Méthodologie & sources"];
var PROS = [
  { icon: "users", label: "Agences immobilières", note: "annuaire ouvert, sans classement payant" },
  { icon: "shield", label: "Notaires", note: "vérification des actes" },
  { icon: "map", label: "Géomètres agréés", note: "bornage & délimitation" },
  { icon: "file", label: "Agents des Domaines", note: "titres & cadastre" }
];

function icon(name, size, color) {
  size = size || 22; color = color || "currentColor";
  var paths = {
    home: '<path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v10h12V10"/>',
    file: '<path d="M6 2h9l5 5v15H6z"/><line x1="9" y1="12" x2="17" y2="12"/><line x1="9" y1="16" x2="17" y2="16"/>',
    map: '<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14c2.7.3 4.5 2.4 4.5 6"/>',
    more: '<circle cx="5" cy="12" r="1.4" fill="' + color + '"/><circle cx="12" cy="12" r="1.4" fill="' + color + '"/><circle cx="19" cy="12" r="1.4" fill="' + color + '"/>',
    globe: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/>',
    shield: '<path d="M12 2l8 3.5v6C20 17 16.5 20.5 12 22c-4.5-1.5-8-5-8-10.5v-6z"/><polyline points="8.5 12 11 14.5 15.5 9.5"/>',
    download: '<path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M5 19h14"/>',
    chevron: '<polyline points="9 6 15 12 9 18"/>',
    calc: '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11.01"/><line x1="12" y1="11" x2="12" y2="11.01"/><line x1="16" y1="11" x2="16" y2="11.01"/><line x1="8" y1="15" x2="8" y2="15.01"/><line x1="12" y1="15" x2="12" y2="15.01"/><line x1="16" y1="15" x2="16" y2="15.01"/>',
    back: '<polyline points="15 18 9 12 15 6"/>'
  };
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (paths[name] || "") + '</svg>';
}
function logoMark(size) {
  size = size || 30;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 120 120" style="flex-shrink:0">' +
    '<rect x="22" y="76" width="76" height="13" rx="2" fill="#F1EAD9"/>' +
    '<rect x="22" y="57" width="54" height="13" rx="2" fill="#A67C3D"/>' +
    '<rect x="22" y="38" width="32" height="13" rx="2" fill="#F1EAD9"/></svg>';
}

var state = { tab: "home", showCalc: false, montant: 20000000, taux: 9, duree: 10 };
var TITLES = { home: "Accueil", rapport: "Rapport Trimestriel", quartiers: "Prix par quartier", annuaire: "Professionnels", plus: "Plus" };

function fmt(n) {
  return Math.round(n).toLocaleString("fr-FR").replace(/,/g, " ").replace(/\u00A0/g, " ");
}

function setTab(t) { state.tab = t; state.showCalc = false; render(); }
function openCalc() { state.showCalc = true; render(); }
function closeCalc() { state.showCalc = false; render(); }
function updateCalc(field, value) {
  state[field] = Number(value);
  render();
}

function screenHome() {
  var z = ZONES[0].quartiers.slice(0, 2).map(function(q) {
    return '<div class="card row"><div class="quartier-name">' + q.nom + '</div><div class="quartier-val' + (q.val ? '' : ' empty') + '">' + (q.val ? q.val + ' F' : q.note) + '</div></div>';
  }).join("");
  return '' +
    '<h1 class="hero">Le marché immobilier malien, enfin mesuré.</h1>' +
    '<div class="sub">Rapports trimestriels indépendants, données vérifiées, aucune agence favorisée.</div>' +
    '<div class="videowrap"><iframe src="https://www.youtube.com/embed/wSM4xI5uivQ" title="Présentation Terrimoine" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' +
    '<div class="card flat"><div class="quartier-name" style="font-size:14.5px;margin-bottom:6px">Notre objectif</div><div style="font-size:13px;color:var(--ink-soft);line-height:1.55">Au Mali, tout le monde parle d\'immobilier, mais personne ne le mesure vraiment. Terrimoine donne à tous — agences, notaires, diaspora, investisseurs — les mêmes données vérifiées, chaque trimestre, sans jamais favoriser un acteur en particulier.</div></div>' +
    '<div class="card stats"><div><div class="stat-val">26</div><div class="stat-label">Quartiers suivis</div></div><div><div class="stat-val">Trimestrielle</div><div class="stat-label">Publication</div></div><div><div class="stat-val">INSTAT·BCEAO</div><div class="stat-label">Sources</div></div></div>' +
    '<a class="btn-primary" style="text-decoration:none" href="rapport-terrimoine-T3-2026.pdf" download>Dernier rapport trimestriel ' + icon("download", 17, "#3E2723") + '</a>' +
    '<div class="card flat clickable row" onclick="openCalc()"><div class="row-start">' + icon("calc", 20, "#3E2723") + '<div class="quartier-name" style="font-size:14.5px">Calculateur de prêt immobilier</div></div>' + icon("chevron", 16, "#6B5B4D") + '</div>' +
    '<div class="section-label">Aperçu quartiers</div>' + z +
    '<div class="card" style="margin-top:18px;text-align:center"><div class="quartier-name" style="font-size:14.5px;margin-bottom:6px">Une question ?</div><div style="font-size:13px;color:var(--ink-soft);line-height:1.7">WhatsApp <b style="color:var(--bronze)">+223 82 68 35 41</b><br>Hamdallaye, Rue 93, Porte 119, Bamako</div></div>';
}

function screenRapport() {
  var list = REPORT_SECTIONS.map(function(s, i) {
    return '<div style="display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0"><span class="report-num">' + String(i + 1).padStart(2, "0") + '</span><span>' + s + '</span></div>';
  }).join("");
  return '' +
    '<div class="sub">Notre publication phare : chaque trimestre, un état des lieux complet et indépendant du marché immobilier malien, gratuit et téléchargeable.</div>' +
    '<div class="report-cover"><div style="font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:2px;color:var(--bronze);margin-bottom:8px">ÉDITION T3 2026 EN COURS</div><div style="font-family:Georgia,serif;font-size:19px;line-height:1.3">Rapport Trimestriel du Marché Immobilier du Mali</div></div>' +
    '<div style="margin-bottom:20px">' + list + '</div>' +
    '<a class="btn-primary" style="text-decoration:none" href="rapport-terrimoine-T3-2026.pdf" download>Télécharger gratuitement ' + icon("download", 17, "#3E2723") + '</a>';
}

function screenQuartiers() {
  var html = '<div class="sub">Suivi trimestre après trimestre à partir des annonces et du réseau terrain.</div>';
  ZONES.forEach(function(zone) {
    html += '<div class="section-label" style="margin-top:0">' + zone.name + '</div>';
    zone.quartiers.forEach(function(q) {
      html += '<div class="card row"><div class="quartier-name">' + q.nom + '</div><div style="text-align:right"><div class="quartier-val' + (q.val ? '' : ' empty') + '" style="font-weight:' + (q.val ? '700' : '400') + '">' + (q.val || "—") + '</div><div style="font-size:10px;color:var(--ink-soft)">' + q.note + '</div></div></div>';
    });
  });
  return html;
}

function screenAnnuaire() {
  var html = '<div class="sub">Un répertoire ouvert, pas un classement payant.</div>';
  PROS.forEach(function(p) {
    html += '<div class="card row-start">' + icon(p.icon, 24, "#A67C3D") + '<div><div class="quartier-name">' + p.label + '</div><div style="font-size:12px;color:var(--ink-soft)">' + p.note + '</div></div></div>';
  });
  html += '<div style="margin-top:16px;font-size:12px;color:var(--ink-soft);font-style:italic;text-align:center">Annuaire en construction — rejoindre la première liste.</div>';
  return html;
}

function screenPlus() {
  return '' +
    '<div class="sub">Diaspora, méthodologie, calculateur et contact — tout ce qui complète le Rapport Trimestriel.</div>' +
    '<div class="card row-start clickable" onclick="openCalc()">' + icon("calc", 22, "#A67C3D") + '<div style="flex:1"><div class="quartier-name" style="font-size:16px">Calculateur de prêt</div><div style="font-size:12px;color:var(--ink-soft)">Mensualité, coût total, intérêts</div></div>' + icon("chevron", 16, "#6B5B4D") + '</div>' +
    '<div class="card">' + icon("globe", 22, "#A67C3D") + '<div class="quartier-name" style="margin:10px 0 6px">Diaspora</div><div style="font-size:13px;color:var(--ink-soft);line-height:1.5">~700 milliards FCFA transférés vers le Mali en 2023. Terrimoine donne à la diaspora la même information que quelqu\'un sur place.</div></div>' +
    '<div class="card">' + icon("shield", 22, "#A67C3D") + '<div class="quartier-name" style="margin:10px 0 6px">Méthodologie</div><div style="font-size:13px;color:var(--ink-soft);line-height:1.5">INSTAT, BCEAO, CAHF, prix de marché suivis, réseau terrain — chaque chiffre indique sa source.</div></div>' +
    '<div class="card"><div class="quartier-name" style="margin-bottom:8px">Contact</div><div style="font-size:13px;color:var(--ink-soft);line-height:1.9">Hamdallaye, Bamako, Mali — Rue 93, Porte 119<br>WhatsApp +223 82 68 35 41<br>terrimoine.com</div></div>';
}

function computeCalc() {
  var r = state.taux / 100 / 12, n = state.duree * 12, m;
  m = r === 0 ? state.montant / n : (state.montant * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  var total = m * n;
  return { mensualite: m, coutTotal: total, interets: total - state.montant };
}

function screenCalculator() {
  var c = computeCalc();
  return '' +
    '<div class="sub">Estimation indicative — les conditions réelles varient selon la banque. Taux immobilier moyen constaté au Mali : autour de 9% pour les particuliers (BCEAO, 2024).</div>' +
    '<div class="card">' +
      '<div class="field"><div class="field-row"><span>Montant du prêt</span><b>' + fmt(state.montant) + ' FCFA</b></div><input type="range" min="1000000" max="150000000" step="500000" value="' + state.montant + '" oninput="updateCalc(\'montant\', this.value)"></div>' +
      '<div class="field"><div class="field-row"><span>Taux d\'intérêt annuel</span><b>' + state.taux + ' %</b></div><input type="range" min="4" max="15" step="0.1" value="' + state.taux + '" oninput="updateCalc(\'taux\', this.value)"></div>' +
      '<div class="field" style="margin-bottom:0"><div class="field-row"><span>Durée du prêt</span><b>' + state.duree + ' ans</b></div><input type="range" min="1" max="25" step="1" value="' + state.duree + '" oninput="updateCalc(\'duree\', this.value)"></div>' +
    '</div>' +
    '<div class="result-box"><div class="result-label">MENSUALITÉ ESTIMÉE</div><div class="result-val">' + fmt(c.mensualite) + ' FCFA</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">par mois</div></div>' +
    '<div class="grid2"><div class="minicard"><b>' + fmt(c.coutTotal) + '</b><small>Coût total (FCFA)</small></div><div class="minicard"><b>' + fmt(c.interets) + '</b><small>Intérêts payés (FCFA)</small></div></div>';
}

var TABS = [
  { key: "home", label: "Accueil", icon: "home", fn: screenHome },
  { key: "rapport", label: "Rapport", icon: "file", fn: screenRapport },
  { key: "quartiers", label: "Quartiers", icon: "map", fn: screenQuartiers },
  { key: "annuaire", label: "Annuaire", icon: "users", fn: screenAnnuaire },
  { key: "plus", label: "Plus", icon: "more", fn: screenPlus }
];

function render() {
  var app = document.getElementById("app");
  if (state.showCalc) {
    app.innerHTML =
      '<div class="topbar"><button class="backbtn" onclick="closeCalc()">' + icon("back", 20, "#F1EAD9") + '</button><div><div class="eyebrow">TERRIMOINE</div><div class="title">Calculateur de prêt</div></div></div>' +
      '<div class="content"><div class="screen">' + screenCalculator() + '</div></div>';
    return;
  }
  var active = TABS.filter(function(t) { return t.key === state.tab; })[0];
  var navHtml = TABS.map(function(t) {
    var isActive = t.key === state.tab;
    return '<button class="navbtn' + (isActive ? ' active' : '') + '" onclick="setTab(\'' + t.key + '\')">' + icon(t.icon, 21, isActive ? "#A67C3D" : "#6B5B4D") + '<span>' + t.label + '</span></button>';
  }).join("");
  app.innerHTML =
    '<div class="topbar">' + logoMark(30) + '<div><div class="eyebrow">TERRIMOINE</div><div class="title">' + TITLES[state.tab] + '</div></div></div>' +
    '<div class="content"><div class="screen">' + active.fn() + '</div></div>' +
    '<div class="bottomnav">' + navHtml + '</div>';
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function() {});
  });
}
</script>
</body>
</html>
