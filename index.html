function CalculatorScreen() {
  const [montant, setMontant] = useState(20000000);
  const [taux, setTaux] = useState(9);
  const [duree, setDuree] = useState(10);

  const { mensualite, coutTotal, interets } = useMemo(() => {
    const r = taux / 100 / 12;
    const n = duree * 12;
    const m = r === 0 ? montant / n : (montant * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    const total = m * n;
    return { mensualite: m, coutTotal: total, interets: total - montant };
  }, [montant, taux, duree]);

  return h("div", { style: { padding: "18px" } },
    h("div", { style: { fontSize: "13px", color: INK_SOFT, marginBottom: "22px", lineHeight: 1.5 } }, "Estimation indicative — les conditions réelles varient selon la banque. Taux immobilier moyen constaté au Mali : autour de 9% pour les particuliers (BCEAO, 2024)."),
    h(Card, { style: { marginBottom: "20px" } },
      h(Slider, { label: "Montant du prêt", value: montant, onChange: setMontant, min: 1000000, max: 150000000, step: 500000, suffix: " FCFA" }),
      h(Slider, { label: "Taux d'intérêt annuel", value: taux, onChange: setTaux, min: 4, max: 15, step: 0.1, suffix: " %" }),
      h(Slider, { label: "Durée du prêt", value: duree, onChange: setDuree, min: 1, max: 25, step: 1, suffix: " ans" })
    ),
    h("div", { style: { background: INK, color: PAPER, borderRadius: "10px", padding: "22px", textAlign: "center", marginBottom: "14px" } },
      h("div", { style: { fontFamily: MONO, fontSize: "11px", letterSpacing: "1.5px", color: BRONZE, marginBottom: "8px" } }, "MENSUALITÉ ESTIMÉE"),
      h("div", { style: { fontFamily: DISPLAY, fontSize: "32px" } }, fmt(mensualite) + " FCFA"),
      h("div", { style: { fontSize: "12px", color: "rgba(241,234,217,0.7)", marginTop: "4px" } }, "par mois")
    ),
    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" } },
      h(Card, { style: { textAlign: "center" } },
        h("div", { style: { fontFamily: MONO, fontSize: "16px", color: BRONZE, fontWeight: 700 } }, fmt(coutTotal)),
        h("div", { style: { fontSize: "11px", color: INK_SOFT, marginTop: "4px" } }, "Coût total (FCFA)")
      ),
      h(Card, { style: { textAlign: "center" } },
        h("div", { style: { fontFamily: MONO, fontSize: "16px", color: BRONZE, fontWeight: 700 } }, fmt(interets)),
        h("div", { style: { fontSize: "11px", color: INK_SOFT, marginTop: "4px" } }, "Intérêts payés (FCFA)")
      )
    )
  );
}
