  "Sirakoro": { appt: 45000, villa: 125000 }
};
var INV_DISPO = {
  "Centre / résidentiel prime": { t: "rare", c: "#B3472F" },
  "Résidentiel établi": { t: "limitée", c: "#A67C3D" },
  "Extension / périphérie": { t: "large", c: "#4C7A4F" }
};
var INV_STANDING = [
  { label: "Economy", cout: 120000 },
  { label: "Standard", cout: 170000 },
  { label: "High-end", cout: 260000 }
];
var INV_VILLA = { 3: { m2: 110, f: 0.8 }, 4: { m2: 150, f: 1 }, 5: { m2: 200, f: 1.3 } };
var INV_PROJETS = [
  { k: "terrain", l: "Land only" },
  { k: "villa", l: "Villa" },
  { k: "r1", l: "Building R+1", s: "2 floors" },
  { k: "r2", l: "Building R+2", s: "3 floors" },
  { k: "r3", l: "Building R+3", s: "4 floors" }
];
var INV_FRAIS_TERRAIN = 0.10;  // mutation, notaire, bornage, titre
var INV_IMPREVUS = 0.08;       // études, permis, imprévus (sur la construction)
var INV_EMPRISE = 0.5;         // part de la parcelle bâtie au sol (immeuble)
var INV_UTILE = 0.85;          // surface utile (hors circulations)
var INV_APPT_M2 = 65;          // surface d'un appartement
var INV_OCCUP = 0.9;           // taux d'occupation
var INV_CHARGES = 0.1;         // charges, entretien, impôts
var INV_LOT_MIN = 150;         // plus petit lot considéré comme constructible

function fmtM(n) {
  if (n >= 1e9) return (Math.round(n / 1e7) / 100).toString() + "\u00A0bn";
  if (n >= 1e6) {
    var v = n / 1e6;
    return (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toString() + "\u00A0M";
  }
  return fmt(n);
}
function invNum(v) { return Number(String(v).replace(/[^0-9]/g, "")) || 0; }
function invPct(x) { return (x * 100).toFixed(1) + " %"; }
function invProjetLabel(p) {
  var pr = INV_PROJETS.filter(function(x) { return x.k === p; })[0];
  return p === "villa" ? "Villa " + state.invVilla + " bedrooms" : pr.l;
}

function openInvest() { state.showInvest = true; render(); }
function closeInvest() { state.showInvest = false; render(); }
function invRefresh() {
  var c = document.querySelector(".content");
  var y = c ? c.scrollTop : 0;
  render();
  c = document.querySelector(".content");
  if (c) c.scrollTop = y;
}
function invSet(field, v) {
  state[field] = v;
  try { if (field === "invProjet") gtag("event", "simulation_projet", { projet: v }); } catch (e) {}
  invRefresh();
}
function invSetBudget(v) {
  var n = invNum(v);
  if (n < 1000000) n = 1000000;
  if (n > 5000000000) n = 5000000000;
  state.invBudget = n;
  try { gtag("event", "simulation_budget", { budget: Math.round(n / 1000000) + "M" }); } catch (e) {}
  invRefresh();
}
function invSetStanding(c) { state.invCout = c; invRefresh(); }
function invSetCout(v) {
  var n = invNum(v);
  if (n >= 50000 && n <= 1000000) state.invCout = n;
  invRefresh();
}

function invCalc(q, p) {
  var S = state.invParcelle, cout = state.invCout, B = state.invBudget;
  if (p === "terrain") {
    var surf = B / (q.prixM2 * (1 + INV_FRAIS_TERRAIN));
    return { surface: surf, ok: surf >= INV_LOT_MIN, total: q.prixM2 * INV_LOT_MIN * (1 + INV_FRAIS_TERRAIN) };
  }
  var terrain = q.prixM2 * S * (1 + INV_FRAIS_TERRAIN);
  var bati, units, loyer, raison = "";
  if (p === "villa") {
    var v = INV_VILLA[state.invVilla];
    bati = v.m2; units = 1;
    loyer = INV_LOYERS[q.nom].villa * v.f * state.invLoyer;
    if (bati > S * 0.6) raison = "Plot of " + S + " m² too small for this villa";
  } else {
    var n = (p === "r1") ? 1 : (p === "r2") ? 2 : 3;
    bati = S * INV_EMPRISE * (n + 1);
    units = Math.floor(bati * INV_UTILE / INV_APPT_M2);
    loyer = units * INV_LOYERS[q.nom].appt * state.invLoyer;
    if (units < 1) raison = "Plot too small for an apartment building";
  }
  var constr = bati * cout * (1 + INV_IMPREVUS);
  var total = terrain + constr;
  var net = loyer * 12 * INV_OCCUP * (1 - INV_CHARGES);
  return { terrain: terrain, constr: constr, bati: bati, units: units, loyer: loyer, total: total, net: net,
           rend: net / total, retour: net > 0 ? total / net : 0, ok: !raison && total <= B, raison: raison };
}

function invRows(p) {
  var rows = VENTE_QUARTIERS.map(function(q) { return { q: q, r: invCalc(q, p) }; });
  var good = rows.filter(function(x) { return x.r.ok; });
  var bad = rows.filter(function(x) { return !x.r.ok; });
  good.sort(function(a, b) { return p === "terrain" ? b.r.surface - a.r.surface : b.r.rend - a.r.rend; });
  bad.sort(function(a, b) { return (a.r.raison ? 1 : 0) - (b.r.raison ? 1 : 0) || a.r.total - b.r.total; });
  return { good: good, bad: bad };
}

function invChip(label, active, onclick, sub) {
  return '<button onclick="' + onclick + '" style="min-width:0;padding:10px 4px;border-radius:8px;border:1px solid var(--bronze);background:' + (active ? "var(--bronze)" : "none") + ';color:' + (active ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12px;font-weight:600;cursor:pointer;line-height:1.25">' + label + (sub ? '<div style="font-size:10px;font-weight:400">' + sub + '</div>' : '') + '</button>';
}
function invGrid(cols, html) {
  return '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:6px">' + html + '</div>';
}
function invLabel(t) {
  return '<div style="font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:1.2px;color:var(--bronze);text-transform:uppercase;margin:14px 0 7px">' + t + '</div>';
}

function invOverview() {
  var B = state.invBudget;
  return INV_PROJETS.map(function(pr) {
    var res = invRows(pr.k);
    var n = res.good.length;
    var info;
    if (n === 0) {
      var minRow = res.bad.filter(function(x) { return !x.r.raison; })[0];
      info = minRow ? "From " + fmtM(minRow.r.total) + " F in " + minRow.q.nom : "Not feasible with these settings";
    } else if (pr.k === "terrain") {
      info = "Up to " + fmt(res.good[0].r.surface) + " m² in " + res.good[0].q.nom;
    } else {
      info = "Net yield up to " + invPct(res.good[0].r.rend) + " (" + res.good[0].q.nom + ")";
    }
    if (n === 0 && pr.k !== "terrain" && pr.k !== "villa" && state.invParcelle > 200) {
      var keep = state.invParcelle; state.invParcelle = 200;
      var alt = invRows(pr.k).good.length; state.invParcelle = keep;
      if (alt) info += " · feasible on 200 m² in " + alt + " neighbourhood" + (alt > 1 ? "s" : "");
    }
    var sel = pr.k === state.invProjet;
    var sub = pr.k === "villa" ? state.invVilla + " br. · " + INV_VILLA[state.invVilla].m2 + " m²" : (pr.s || "plots available");
    return '<div onclick="invSet(\'invProjet\',\'' + pr.k + '\')" style="cursor:pointer;background:' + (sel ? "#FBF6EA" : "#fff") + ';border:' + (sel ? "2px solid var(--bronze)" : "1px solid var(--paper-deep)") + ';border-radius:10px;padding:' + (sel ? "11px 13px" : "12px 14px") + ';margin-bottom:8px">' +
      '<div class="row"><div><div class="quartier-name" style="font-size:15px">' + pr.l + '</div><div style="font-size:10.5px;color:var(--ink-soft)">' + sub + '</div></div>' +
      '<div style="text-align:right"><div class="quartier-val" style="color:' + (n ? "#4C7A4F" : "#B3472F") + '">' + n + ' / ' + VENTE_QUARTIERS.length + '</div><div style="font-size:10px;color:var(--ink-soft)">quartiers</div></div></div>' +
      '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px">' + info + '</div></div>';
  }).join("");
}

function invCard(x, p, best) {
  var q = x.q, r = x.r;
  var d = INV_DISPO[q.zone] || INV_DISPO["Résidentiel établi"];
  var zone = '<div style="font-size:10.5px;color:var(--ink-soft)">' + q.zone + ' · availability <span style="color:' + d.c + ';font-weight:600">' + d.t + '</span></div>';
  if (!r.ok) {
    var right = r.raison
      ? '<div style="font-size:11px;color:#B3472F;text-align:right;max-width:55%">' + r.raison + '</div>'
      : '<div style="text-align:right"><div class="quartier-val" style="color:#B3472F">' + fmtM(r.total) + ' F</div><div style="font-size:10.5px;color:#B3472F">short by ' + fmtM(r.total - state.invBudget) + '</div></div>';
    return '<div class="card" style="opacity:.7;padding:12px 16px"><div class="row" style="align-items:flex-start;gap:10px"><div><div class="quartier-name">' + q.nom + '</div>' + zone + '</div>' + right + '</div></div>';
  }
  if (p === "terrain") {
    var lots = Math.floor(r.surface / 300);
    return '<div class="card"><div class="row" style="align-items:flex-start;gap:10px"><div><div class="quartier-name">' + q.nom + '</div>' + zone + '</div>' +
      '<div style="text-align:right"><div class="quartier-val">' + fmt(r.surface) + ' m²</div><div style="font-size:10.5px;color:var(--ink-soft)">' + fmt(q.prixM2) + ' F/m²</div></div></div>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5">' + (lots >= 1 ? "That is about " + lots + " plot" + (lots > 1 ? "s" : "") + " of 300 m². " : "A lot of " + INV_LOT_MIN + " at 300 m². ") + "Acquisition costs included (" + Math.round(INV_FRAIS_TERRAIN * 100) + " %). No rent until something is built.</div></div>";
  }
  var detail = "Land " + state.invParcelle + " m² : " + fmtM(r.terrain) + " · Construction (" + fmt(r.bati) + " m² built): " + fmtM(r.constr);
  var loyer = p === "villa"
    ? "Estimated villa rent: " + fmtM(r.loyer) + " F/month"
    : "≈ " + r.units + " apartment" + (r.units > 1 ? "s" : "") + " · estimated rents " + fmtM(r.loyer) + " F/month";
  return '<div class="card"' + (best ? ' style="border-color:var(--bronze);border-width:2px"' : '') + '>' +
    (best ? '<div style="font-family:\'Courier New\',monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--bronze);margin-bottom:6px">BEST YIELD</div>' : '') +
    '<div class="row" style="align-items:flex-start;gap:10px"><div><div class="quartier-name">' + q.nom + '</div>' + zone + '</div>' +
    '<div style="text-align:right"><div class="quartier-val">' + fmtM(r.total) + ' F</div><div style="font-size:10.5px;color:#4C7A4F;font-weight:600">within budget</div></div></div>' +
    '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5">' + detail + '<br>' + loyer + '</div>' +
    '<div class="grid2" style="margin-top:10px"><div class="minicard" style="padding:10px"><b style="font-size:15px">' + invPct(r.rend) + '</b><small>Net yield / year</small></div>' +
    '<div class="minicard" style="padding:10px"><b style="font-size:15px">' + (r.retour ? "~" + Math.round(r.retour) + " years" : "—") + '</b><small>Return on investment</small></div></div></div>';
}

function invAnalyse(p, res) {
  var B = state.invBudget, out = [];
  var label = invProjetLabel(p);
  if (!res.good.length) {
    var m = res.bad.filter(function(x) { return !x.r.raison; })[0];
    out.push("With " + fmt(B) + " FCFA, no tracked neighbourhood allows \"" + label + "\" with the chosen settings." + (m ? " The minimum budget observed is " + fmtM(m.r.total) + " F in " + m.q.nom + "." : " Try a larger plot or another project."));
    return out;
  }
  out.push("\"" + label + "\" is feasible in " + res.good.length + " neighbourhood" + (res.good.length > 1 ? "s" : "") + " on " + VENTE_QUARTIERS.length + ".");
  if (p === "terrain") {
    var cheap = res.good[0];
    out.push("It is in " + cheap.q.nom + " that this budget buys the largest plot (" + fmt(cheap.r.surface) + " m²).");
  } else {
    var best = res.good[0];
    var low = res.good.slice().sort(function(a, b) { return a.r.total - b.r.total; })[0];
    out.push("Most profitable: " + best.q.nom + " (net yield " + invPct(best.r.rend) + ", payback ~" + Math.round(best.r.retour) + " years). Cheapest: " + low.q.nom + " (" + fmtM(low.r.total) + " F in total).");
    if (best.r.rend < 0.05) out.push("Net yield below 5%: with these costs and the rents recorded, letting only slowly covers the construction. Check the real cost with a contractor and the target rent for a new property (settings above).");
    else if (best.r.rend >= 0.08) out.push("Net yield above 8%: to be confirmed on the ground, as it depends heavily on the real construction cost and the rent obtained.");
  }
  var nz = { "Extension / périphérie": 0, "Résidentiel établi": 0, "Centre / résidentiel prime": 0 };
  res.good.forEach(function(x) { nz[x.q.zone]++; });
  out.push("Availability (indicative): " + nz["Extension / périphérie"] + " neighbourhood(s) on the outskirts (land easier to find), " + nz["Résidentiel établi"] + " in established areas, " + nz["Centre / résidentiel prime"] + " in the central zone (scarce plots).");
  return out;
}

function screenInvest() {

  var budgets = [20000000, 40000000, 60000000, 100000000, 200000000, 500000000];
  var budgetChips = invGrid(3, budgets.map(function(b) { return invChip(fmtM(b) + " F", b === B, "invSetBudget(" + b + ")"); }).join(""));

    params = '<div class="card">' +
      invLabel("Plot size").replace("margin:14px 0 7px", "margin:0 0 7px") +
      invGrid(3, [200, 300, 400].map(function(s) { return invChip(s + " m²", S === s, "invSet('invParcelle'," + s + ")"); }).join("")) +
      (p === "villa" ? invLabel("Villa: number of bedrooms (+ living room, showers)") + invGrid(3, [3, 4, 5].map(function(c) { return invChip(c + " bedrooms", state.invVilla === c, "invSet('invVilla'," + c + ")", INV_VILLA[c].m2 + " m² built"); }).join("")) : "") +
      invLabel("Construction finish") +
      invGrid(3, INV_STANDING.map(function(s) { return invChip(s.label, state.invCout === s.cout, "invSetStanding(" + s.cout + ")", fmtM(s.cout) + " F/m²"); }).join("")) +
      '<div style="font-size:11px;color:var(--ink-soft);margin:10px 0 5px">Construction cost used (FCFA per built m²), editable with your quote:</div>' +
      '<input type="text" inputmode="numeric" value="' + fmt(state.invCout) + '" onchange="invSetCout(this.value)" style="width:100%;font-size:15px;padding:9px 12px;border:1px solid var(--paper-deep);border-radius:8px;background:#fff;color:var(--ink)">' +
      invLabel("Target rent level") +
      invGrid(3, [[1, "Market", "median recorded"], [1.25, "+25 %", "new property"], [1.5, "+50 %", "very good condition"]].map(function(o) { return invChip(o[1], state.invLoyer === o[0], "invSet('invLoyer'," + o[0] + ")", o[2]); }).join("")) +

  }

  var res = invRows(p);

  var analyse = invAnalyse(p, res).map(function(t) { return '<div style="font-size:13px;line-height:1.55;margin-bottom:8px">' + t + '</div>'; }).join("");

  var hyp = '<div style="font-size:11.5px;color:var(--ink-soft);line-height:1.6">' +
    "<b>Land price</b>: median of Terrimoine Q3 2026 records by neighbourhood. <b>Acquisition costs</b>: +" + Math.round(INV_FRAIS_TERRAIN * 100) + " % of the land (transfer, notary, boundary marking, title). " +
    "<b>Construction</b>: " + fmt(state.invCout) + " F per built m² + " + Math.round(INV_IMPREVUS * 100) + " % for studies, permits and contingencies (assumption to validate with a contractor). " +
    "<b>Villa</b>: 3, 4 or 5 bedrooms = 110, 150 or 200 m² built, on at most 60% of the plot. " +
    "<b>Building</b>: " + Math.round(INV_EMPRISE * 100) + " % of the plot built on the ground, apartments of " + INV_APPT_M2 + " m² (" + Math.round(INV_UTILE * 100) + " % usable area). " +
    "<b>Rents</b>: median of the records by neighbourhood (pilot edition: 3 records per property type) × chosen level; occupancy " + Math.round(INV_OCCUP * 100) + " %, charges and maintenance " + Math.round(INV_CHARGES * 100) + " %. " +
    "<b>Availability</b>: indicative, deduced from the type of zone, not yet measured. " +
    "This simulator guides your thinking; it replaces neither a feasibility study nor a quote.</div>";

  var shareTxt = "With " + fmtM(B) + " FCFA, what can you do in Bamako? Land, villa, R+1 to R+3 building: neighbourhood by neighbourhood, with profitability. Run your free simulation 👇";

  return '' +
    '<div class="sub">Enter an amount: see what it allows in each Bamako neighbourhood (land, villa, building) and what it could earn.</div>' +
    '<div class="card"><div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px">My total budget (FCFA)</div>' +
    '<input type="text" inputmode="numeric" value="' + fmt(B) + '" onchange="invSetBudget(this.value)" style="width:100%;font-size:22px;font-family:Georgia,serif;padding:10px 12px;border:1px solid var(--bronze);border-radius:8px;background:#fff;color:var(--ink);margin-bottom:10px">' +
    budgetChips + '</div>' +
    '<div class="section-label" style="margin-top:6px">What does this budget allow?</div><div style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 10px">Tap a project to see the detail by neighbourhood.</div>' +
    invOverview() +
    params +
    '<div class="section-label" style="margin-top:16px">' + invProjetLabel(p) + ": detail by neighbourhood</div>" +
    '<div style="margin-top:10px">' + list + '</div>' +
    '<div class="card flat" style="margin-top:6px"><div class="quartier-name" style="font-size:14.5px;margin-bottom:8px">Market reading</div>' + analyse + '</div>' +
    shareBtn(shareTxt, "Invite a friend to simulate their budget", "budget=" + B) +
    '<a href="' + waLink("Hello, I have a budget of " + fmt(B) + " FCFA for a \"" + invProjetLabel(p) + "\" project in Bamako and I would like to be supported by Terrimoine Conseil.") + '" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);border-radius:10px;padding:14px;margin-top:2px">Have my project validated by Terrimoine Conseil</a>' +
    '<div class="card" style="margin-top:14px">' + '<div class="section-label" style="margin:0 0 8px">Assumptions and limits</div>' + hyp + '</div>' +
    '<div style="margin-top:10px">' + renderSponsor(SPONSOR_CALC, "Finance this project with:") + '</div>';
}

// ---------- Devis matériaux ----------
// Prix : bulletin INSTAT des matériaux de construction à Bamako (juin 2026) pour ciment, fer, sable, gravier, moellon, carreaux.
// Hypothèses Terrimoine pour agglos, toiture, menuiserie, sanitaires, électricité, peinture, main-d'œuvre.
var DEV_PRIX_DEFAUT = { ciment: 129000, sable: 13286, gravier: 22357, moellon: 4750, agglo: 450,
  fer6: 1270, fer8: 1820, fer10: 2600, fer12: 5300, fer14: 9200, tole: 12000, terrasse: 3000, mo: 30 };
var DEV_FER_KG = { fer6: 2.66, fer8: 4.74, fer10: 7.40, fer12: 10.66, fer14: 14.50 };   // kg par barre de 12 m
var DEV_FER_PART = { fer6: 0.15, fer8: 0.20, fer10: 0.25, fer12: 0.30, fer14: 0.10 };   // répartition en poids
var DEV_FINITION = [
  { label: "Economy", carreau: 5020, peinture: 1200, porte: 60000, fenetre: 50000, sanitaire: 180000, elec: 4500 },
  { label: "Standard", carreau: 5550, peinture: 1800, porte: 90000, fenetre: 80000, sanitaire: 280000, elec: 7000 },
  { label: "High-end", carreau: 7438, peinture: 3000, porte: 150000, fenetre: 130000, sanitaire: 450000, elec: 11000 }
];
var DEV_PRESETS = [[10, 15], [12, 20], [15, 20], [20, 20], [20, 30], [25, 40]];
var DEV_NIVEAUX = ["Ground floor", "R+1", "R+2", "R+3"];

function fq(x, d) { var k = Math.pow(10, d); return (Math.round(x * k) / k).toString(); }
function openDevis() { state.showDevis = true; render(); }
function closeDevis() { state.showDevis = false; render(); }
function devSet(field, v) { state[field] = v; invRefresh(); }
function devSetDim(field, v) {
  var n = invNum(v);
  if (n < 4) n = 4;
  if (n > 100) n = 100;
  state[field] = n; state.devSurfCustom = 0; invRefresh();
}
function devSetPreset(l, p) { state.devL = l; state.devP = p; state.devSurfCustom = 0; invRefresh(); }
function devSetPct(x) { state.devPct = x; state.devSurfCustom = 0; invRefresh(); }
function devSetSurf(v) { var n = invNum(v); state.devSurfCustom = n < 20 ? 0 : Math.min(n, 2000); invRefresh(); }
function devSetPrix(key, v) { var n = invNum(v); if (n > 0) state.devPrix[key] = n; invRefresh(); }
function devResetPrix() { state.devPrix = JSON.parse(JSON.stringify(DEV_PRIX_DEFAUT)); invRefresh(); }

function devCalc() {
  var P = state.devPrix, n = state.devN, S = state.devL * state.devP;
  var a = state.devSurfCustom > 0 ? state.devSurfCustom : Math.max(20, Math.round(S * state.devPct));
  var A = a * n, h = 3.0;
  var fin = DEV_FINITION[state.devStanding];
  var perim = 4.057 * Math.sqrt(a);          // rectangle 1 : 1,4
  var lint = 0.45 * a;                        // murs intérieurs par niveau (m)
  var wallA = (perim + lint) * h * 0.85 * n;  // m² de murs, 15 % d'ouvertures déduits
  var agglos = Math.ceil(wallA * 12.5 * 1.05);
  var mortier = wallA * 0.03;
  var enduit = wallA * 2 * 0.02 + A * 0.015;
  var carrSurf = A * 0.9;
  var chape = carrSurf * 0.03;
  var sec = 0.15 + 0.05 * (n - 1);
  var vFond = (perim + 0.6 * lint) * 0.32 * (1 + 0.2 * (n - 1));
  var vPot = Math.ceil(a / 8) * sec * sec * (h * n + 0.5);
  var vPoutre = 2 * (perim + 0.8 * lint) * (n > 1 ? 0.06 : 0.03) * n;
  var vDallage = a * 0.10;
  var planchers = (n - 1) + (state.devToit === "terrasse" ? 1 : 0);
  var vDalle = planchers * a * 0.15;
  var vEsc = n > 1 ? (n - 1) * 1.5 : 0;
  var vLint = 0.005 * wallA;
  var beton = vFond + vPot + vPoutre + vDallage + vDalle + vEsc + vLint;
  var acier = vFond * 70 + vPot * 160 + vPoutre * 130 + vDallage * 30 + vDalle * 80 + vEsc * 120 + vLint * 130;
  var cimentKg = beton * 350 + mortier * 350 + enduit * 400 + chape * 350;
  var sable = (beton * 0.45 + mortier + enduit + chape) * 1.05;
  var gravier = beton * 0.85;
  var moellon = a * 0.2;
  var chambres = Math.max(1, Math.round(A / 30));
  var douches = Math.max(1, Math.round(chambres * 0.7));
  var portes = chambres + douches + 2 * n + 1;
  var fenetres = chambres + 2 * n + 1;

  var go = [], fi = [];
  function add(list, nom, qte, total) { list.push({ nom: nom, qte: qte, total: total }); }
  add(go, "Ciment CPJ45", fq(cimentKg / 1000, 1) + " t (≈ " + fmt(Math.ceil(cimentKg / 50)) + " bags of 50 kg)", cimentKg / 1000 * P.ciment);
  var ferKgTot = 0;
  ["fer6", "fer8", "fer10", "fer12", "fer14"].forEach(function(k) {
    var kg = acier * DEV_FER_PART[k], barres = Math.ceil(kg / DEV_FER_KG[k]);
    ferKgTot += barres * DEV_FER_KG[k];
    add(go, "Steel " + (k === "fer6" ? "plain round bar Ø6" : "Ribbed bar Ø" + k.slice(3)), fmt(barres) + " bars of 12 m", barres * P[k]);
  });
  add(go, "River sand", fq(sable, 1) + " m³ (≈ " + Math.ceil(sable / 10) + " trips of 10 m³)", sable * P.sable);
  add(go, "River gravel", fq(gravier, 1) + " m³ (≈ " + Math.ceil(gravier / 10) + " trips of 10 m³)", gravier * P.gravier);
  add(go, "Blocks (breeze blocks) 15", fmt(agglos) + " units", agglos * P.agglo);
  add(go, "Rubble stone (hardcore)", fq(moellon, 1) + " m³", moellon * P.moellon);
  var goSum = go.reduce(function(s, x) { return s + x.total; }, 0);
  add(go, "Miscellaneous structural work (formwork, tie wire, nails)", "8% of structural work", goSum * 0.08);

  var roofA = a * 1.25;
  if (state.devToit === "terrasse") add(fi, "Terrace waterproofing", fmt(a) + " m²", a * P.terrasse);
  else add(fi, "Sheet-metal roofing (frame + sheets fitted)", fmt(roofA) + " m²", roofA * P.tole);
  add(fi, "Tiling (" + fin.label.toLowerCase() + ")", fmt(carrSurf * 1.1) + " m² (+10% waste)", carrSurf * 1.1 * fin.carreau);
  var paintA = 2 * wallA + A;
  add(fi, "Paint and finishing renders", fmt(paintA) + " m²", paintA * fin.peinture);
  add(fi, "Doors", portes + " units", portes * fin.porte);
  add(fi, "Windows", fenetres + " units", fenetres * fin.fenetre);
  add(fi, "Plumbing and sanitary fittings", douches + " shower(s)/WC + kitchen", douches * fin.sanitaire + 150000);
  add(fi, "Electrics", fmt(A) + " m²", A * fin.elec);

  var fiSum = fi.reduce(function(s, x) { return s + x.total; }, 0);
  var goTotal = goSum + goSum * 0.08;
  var mat = goTotal + fiSum;
  var mo = mat * P.mo / 100;
  var constr = mat + mo;
  var q = VENTE_QUARTIERS.filter(function(x) { return x.nom === state.devQuartier; })[0];
  var terrain = q ? q.prixM2 * S * (1 + INV_FRAIS_TERRAIN) : 0;
  return { S: S, a: a, A: A, n: n, go: go, fi: fi, goTotal: goTotal, fiSum: fiSum, mat: mat, mo: mo, constr: constr, perM2: constr / A,
           terrain: terrain, q: q, total: constr + terrain, cimentT: cimentKg / 1000, ferT: ferKgTot / 1000, sable: sable, gravier: gravier,
           beton: beton, agglos: agglos, chambres: chambres, douches: douches };
}

function proRendement() {
  var p = state.pro, cout = p.rPrix * (1 + p.rFrais / 100), loyerAn = p.rLoyer * 12, loyerEff = loyerAn * (1 - p.rVac / 100);

    '<div class="card">' + pLine("Total acquisition cost", fmt(cout) + " F") + pLine("Rents per year after vacancy", fmt(Math.round(loyerEff)) + " F") + pLine("Charges and taxes per year", fmt(Math.round(charges)) + " F") + pLine("Net income per year", fmt(Math.round(net)) + " F") +
    pLine("Return on investment", net > 0 ? fq(cout / net, 1) + " years" : "n/a") + cfLine + (emprunt > 0 ? pLine("Your contribution", fmtM(mise) + " F") : "") + '</div>' +

function proFrais() {
  var p = state.pro, prix = p.fPrix;
  var mut = prix * p.fMut / 100, not = prix * p.fNot / 100, total = prix + mut + not + p.fBorn + p.fTitre + p.fAutres;
  var fr = mut + not + p.fBorn + p.fTitre + p.fAutres;
  var msg = "Hello, I have estimated the acquisition costs of a plot of " + fmtM(prix) + " FCFA (about " + fmtM(fr) + " FCFA in costs) and I would like support for the land title.";
  return '<div class="sub">Beyond the land price, how much do transfer, notary, boundary marking and the land title cost?</div>' + PRO_RATE_WARN +
    pGrid(pIn("fPrix", "Land price (F)") + pIn("fMut", "Transfer duties (%)", "dec") + pIn("fNot", "Notary fees (%)", "dec") + pIn("fBorn", "Boundary marking and plan (F)") + pIn("fTitre", "Title procurement costs (F)") + pIn("fAutres", "Other costs (F)")) +

iv><div class="quartier-name" style="margin-bottom:2px">Boubakary Tamboura</div><div style="font-size:12px;color:var(--bronze)">Founder of Terrimoine</div></div></div><div style="font-size:13px;color:var(--ink-soft);line-height:1.6">Terrimoine was born from a simple observation, lived on the ground: in Mali, real estate remains one of the most opaque markets in the country. Prices circulate by word of mouth, information is scattered between WhatsApp listings and informal networks, and the diaspora can verify nothing from a distance.<br><br>A licensed Property Administrator since 2017 (professional card no. 018), member of the Chamber of Property Managers and Estate Agents of Mali, and head of Groupe Kadia Keita Immo et Presta Services (GKIMMO), Boubakary is convinced that a market needs a neutral source to work well — a publication that favours no agency, and that makes the same data available to everyone.<br><br>He is also the creator of the podcast <i>Brique par Brique</i>, dedicated to real estate education for Malians, at home and in the diaspora.</div></div>' +

function computeCalc() {
  var r = state.taux / 100 / 12, n = state.duree * 12, m;
  m = r === 0 ? state.montant / n : (state.montant * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  var total = m * n;
  return { mensualite: m, coutTotal: total, interets: total - state.montant };
}
function computeCapacite() {
  var mensualiteMax = state.revenu * 0.33;
  var r = state.taux / 100 / 12, n = state.duree * 12;
  var capacite = r === 0 ? mensualiteMax * n : mensualiteMax * (1 - Math.pow(1 + r, -n)) / r;
  return { mensualiteMax: mensualiteMax, capacite: capacite };
}

function modeTabs() {
  return '<div style="display:flex;gap:8px;margin-bottom:18px">' +
    '<button onclick="setCalcMode(\'mensualite\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bronze);background:' + (state.calcMode === "mensualite" ? "var(--bronze)" : "none") + ';color:' + (state.calcMode === "mensualite" ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12.5px;font-weight:600;cursor:pointer">Monthly payment</button>' +
    '<button onclick="setCalcMode(\'capacite\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bronze);background:' + (state.calcMode === "capacite" ? "var(--bronze)" : "none") + ';color:' + (state.calcMode === "capacite" ? "var(--ink)" : "var(--ink-soft)") + ';font-size:12.5px;font-weight:600;cursor:pointer">Borrowing capacity</button>' +
  '</div>';
}

function screenCalculator() {
  if (state.calcMode === "capacite") {
    var cc = computeCapacite();
    return '' +
      modeTabs() +
      '<div class="sub">Indicative estimate, usual rule of a maximum 33% debt ratio.</div>' +
      '<div class="card">' +
        '<div class="field"><div class="field-row"><span>Monthly income</span><b>' + fmt(state.revenu) + ' FCFA</b></div><input type="range" min="100000" max="3000000" step="25000" value="' + state.revenu + '" oninput="updateCalc(\'revenu\', this.value)"></div>' +
        '<div class="field"><div class="field-row"><span>Annual interest rate</span><b>' + state.taux + ' %</b></div><input type="range" min="4" max="15" step="0.1" value="' + state.taux + '" oninput="updateCalc(\'taux\', this.value)"></div>' +
        '<div class="field" style="margin-bottom:0"><div class="field-row"><span>Loan term</span><b>' + state.duree + ' years</b></div><input type="range" min="1" max="25" step="1" value="' + state.duree + '" oninput="updateCalc(\'duree\', this.value)"></div>' +
      '</div>' +
      '<div class="result-box"><div class="result-label">ESTIMATED BORROWABLE AMOUNT</div><div class="result-val">' + fmt(cc.capacite) + ' FCFA</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">max. monthly payment ' + fmt(cc.mensualiteMax) + ' FCFA</div></div>';
  }
  var c = computeCalc();
  return '' +
    modeTabs() +
    '<div class="sub">Indicative estimate — actual conditions vary by bank. Average property loan rate observed in Mali: around 9% for individuals (BCEAO, 2024).</div>' +
    '<div class="card">' +
      '<div class="field"><div class="field-row"><span>Loan amount</span><b>' + fmt(state.montant) + ' FCFA</b></div><input type="range" min="1000000" max="150000000" step="500000" value="' + state.montant + '" oninput="updateCalc(\'montant\', this.value)"></div>' +
      '<div class="field"><div class="field-row"><span>Annual interest rate</span><b>' + state.taux + ' %</b></div><input type="range" min="4" max="15" step="0.1" value="' + state.taux + '" oninput="updateCalc(\'taux\', this.value)"></div>' +
      '<div class="field" style="margin-bottom:0"><div class="field-row"><span>Loan term</span><b>' + state.duree + ' years</b></div><input type="range" min="1" max="25" step="1" value="' + state.duree + '" oninput="updateCalc(\'duree\', this.value)"></div>' +
    '</div>' +
    '<div class="result-box"><div class="result-label">ESTIMATED MONTHLY PAYMENT</div><div class="result-val">' + fmt(c.mensualite) + ' FCFA</div><div style="font-size:12px;color:rgba(241,234,217,0.7);margin-top:4px">per month</div></div>' +
    '<div class="grid2">' +
      '<div class="minicard"><b>' + fmt(c.coutTotal) + '</b><small>Total cost (FCFA)</small></div>' +
      '<div class="minicard"><b>' + fmt(c.interets) + '</b><small>Interest paid (FCFA)</small></div>' +
    '</div>' +
    shareBtn("A property loan in Mali: what monthly payment for " + fmtM(state.montant) + " F over " + state.duree + " years? Calculate yours for free 👇", "Invite a friend to calculate their loan", "calcul") +
    '<div style="margin-top:14px">' + renderSponsor(SPONSOR_CALC, "This calculation is made possible by:") + '</div>';
}

function screenDiasporaSim() {
  var budget = BUDGETS.filter(function(b) { return b.key === state.diasporaBudget; })[0];
  var maxPrixM2 = budget.max / REF_SURFACE;
  var matches = VENTE_QUARTIERS.filter(function(q) { return q.prixM2 <= maxPrixM2; }).sort(function(a, b) { return b.prixM2 - a.prixM2; });
  var budgetBtns = BUDGETS.map(function(b) {
    var active = b.key === state.diasporaBudget;

function screenGuideFoncier() {
  return '' +
    '<div class="sub">How to move from a precarious (provisional) title to a definitive land title, according to Mali\'s Domain and Land Code.</div>' +

    guideSection("What are precarious titles?", "Before obtaining a land title — today the only fully recognised and unassailable title of ownership — many Malians hold so-called precarious or provisional titles: allocation letter, occupancy permit, rural or urban concession, municipal notification. Historically issued by a mayor, a prefect, a sub-prefect or a village chief, these documents are no longer enough on their own to fully secure a property.") +

    guideSection("An important change since 2021", "The reform of the Domain and Land Code (law no. 2021-056 of 7 October 2021) set a clear rule: holders of provisional titles have 10 years to convert them into a land title. Since this reform, only a properly established land title is recognised as definitive and unassailable before Malian courts — and since the most recent domain reforms, it is now the only valid deed of ownership for acquiring a plot.") +

    '<div class="section-label" style="margin-top:22px">The steps of the conversion</div>' +
    '<div style="display:grid;gap:10px;margin-top:10px">' +
      guideStep(1, "Build the file", "Stamped application (500 FCFA) addressed to the Regional Director of Domains and Cadastre, accompanied by a copy of the deed of ownership or allocation, a copy of the national ID card, and an extract of the plot's location plan.") +
      guideStep(2, "Instruct a licensed surveyor", "The expert surveyor draws up the plot's delimitation plan and the boundary-marking report.") +
      guideStep(3, "Publication & objection period", "A notice of registration application is published; a 30-day period lets any third party assert a challenge or a right over the plot.") +
      guideStep(4, "Creation of the land title", "In the absence of a well-founded objection, the land title is established in the land registers, in the holder's name, at the competent land registry.") +
    '</div>' +

    guideSection("Indicative costs and timescales", "Registration duty: 15% of the plot's price. Transfer duty: 0.9%. Statutory timescale: up to 6 months according to the texts in force. These amounts may change — check them with the Domains office when you start your procedure.") +

    guideSection("And the One-Stop Land Office?", "Since 2025, the State has started to simplify this procedure through the Land Information System and its One-Stop Land Office (SIF/GUF), with a stated aim of reducing costs and speeding up procedures, zone by zone — already active in the seven districts of Bamako.") +

    '<div class="card flat" style="margin-top:22px"><div style="font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px"><b style="color:var(--ink)">Key point:</b> this guide is informational, not personalised legal advice. Each file has its particularities — a notary, a Domains and Cadastre officer, or Terrimoine Conseil can support you on your specific case.</div><a href="' + waLink("Hello, I need help converting my precarious title into a land title.") + '" target="_blank" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--ink);border-radius:8px;padding:10px">Get support on WhatsApp</a></div>';

// ---------- mesure d'audience (Google Analytics) ----------
var _lastScreen = "";
function currentScreen() {
  if (state.showCalc) return "calculateur";
  if (state.showSvc) return "services-" + (state.svcView || "hub");
  if (state.showPro) return "pro-" + (state.proView || "hub");
  if (state.showDevis) return "devis-materiaux";
  if (state.showVerif) return "verifier-terrain";
  if (state.showInvest) return "simulateur-budget";
  if (state.showDiasporaSim) return "simulateur-diaspora";
  if (state.showGuideFoncier) return "guide-titre-foncier";
  if (state.showPublicite) return "espace-publicitaire";
  return state.tab;
}
function trackScreen() {
  try {
    var sc = currentScreen();
    if (sc === _lastScreen) return;
    _lastScreen = sc;
    gtag('event', 'page_view', { page_title: sc, page_location: location.origin + '/#' + sc });
  } catch (e) {}
}
document.addEventListener('click', function(e) {
  try {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a || !a.href) return;
    if (a.href.indexOf('wa.me/?text') > -1) gtag('event', 'partage_whatsapp', { ecran: currentScreen() });
    else if (a.href.indexOf('.pdf') > -1) gtag('event', 'telechargement_rapport', { ecran: currentScreen() });
    else if (a.href.indexOf('wa.me') > -1) gtag('event', 'clic_whatsapp', { ecran: currentScreen() });
    else if (a.href.indexOf('youtube') > -1) gtag('event', 'clic_video', { ecran: currentScreen() });
    else if (a.target === '_blank' && a.href.indexOf(location.host) === -1) gtag('event', 'clic_sponsor', { ecran: currentScreen(), lien: a.href.slice(0, 100) });
  } catch (err) {}
});

function applyHash() {
  try {
    var h = (location.hash || "").replace("#", "");
    if (!h) return;
    var parts = h.split("=");
    var key = parts[0];
    if (key === "budget") {
      var n = invNum(parts[1]);
      if (n >= 1000000) state.invBudget = Math.min(n, 5000000000);
      state.showInvest = true;
    } else if (key === "devis") {
      var d = (parts[1] || "").split(",").map(Number);
      if (d[0] >= 20 && d[0] <= 2000) state.devSurfCustom = d[0];
      if (d[1] >= 1 && d[1] <= 4) state.devN = d[1];
      if (d[2] >= 4 && d[2] <= 100) state.devL = d[2];
      if (d[3] >= 4 && d[3] <= 100) state.devP = d[3];
      state.showDevis = true;
    } else if (["pro","frais","impot","rendement","patrimoine","premium","boutique"].indexOf(key) > -1) {
      proInit(); state.showPro = true; state.proView = key === "pro" ? "hub" : key;
    } else if (key === "alertes") {
      state.showSvc = true; state.svcView = "form"; state.svcId = "alertes";
    } else if (key === "annonces") {
      state.showSvc = true; state.svcView = "annonces";
    } else if (key === "services") {
      state.showSvc = true; state.svcView = "hub";
    } else if (key === "guide") {
      state.showSvc = true; state.svcView = "guide"; state.svcId = parts[1] === "diaspora" ? "guide_diaspora" : "guide_tf";
    } else if (key === "verif") {
      state.showVerif = true;
    } else if (key === "calcul") {
      state.showCalc = true;
    } else if (TITLES[key]) {
      state.tab = key;
    } else { return; }
    gtag("event", "arrivee_lien_partage", { cible: key });
  } catch (e) {}
}

var ZEN={"Centre / résidentiel prime":"Central / prime residential","Résidentiel établi":"Established residential","Extension / périphérie":"Extension / outskirts"};
var DEN={"rare":"scarce","limitée":"limited","large":"wide"};
(function(){var _r=render;render=function(){var r=_r.apply(this,arguments);try{var w=document.createTreeWalker(document.getElementById("app"),NodeFilter.SHOW_TEXT),n,L=[];while(n=w.nextNode())L.push(n);L.forEach(function(n){var t=n.nodeValue,o=t;for(var k in ZEN)if(t.indexOf(k)>-1)t=t.split(k).join(ZEN[k]);if(DEN[t.trim()]&&n.parentNode&&n.parentNode.tagName==="SPAN")t=DEN[t.trim()];if(t!==o)n.nodeValue=t;});}catch(e){}return r;};})();
applyHash();
render();
trackScreen();
