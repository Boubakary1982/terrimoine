name: Deplacer pages anglaises
on:
  push:
    paths:
      - '.github/workflows/deplacer-en.yml'
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p en
          for f in about.html bamako-market-report.html bamako-property-prices.html building-materials-quote-bamako.html buy-land-bamako-guide.html check-land-before-buying-mali.html guides.html index.html invest-in-mali-from-abroad.html land-title-guide-mali.html land-transfer-titling-costs-mali.html land-value-simulator-bamako.html methodology.html mortgage-calculator-mali.html privacy.html property-prices-baco-djicoroni.html property-prices-badalabougou.html property-prices-bamako-coura.html property-prices-faladie.html property-prices-hamdallaye-aci.html property-prices-kalaban-coura.html property-prices-lafiabougou.html property-prices-quartier-du-fleuve.html property-prices-sebenikoro.html property-prices-sirakoro.html property-prices-sotuba.html property-prices-yirimadio.html property-tax-simulator-mali.html rental-yield-simulator-bamako.html sitemap-en.xml verified-listings.html; do
            if [ -f "$f" ]; then git mv -f "$f" "en/$f"; fi
          done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deplacer les pages anglaises dans le dossier en" || echo "rien a deplacer"
          git push
